<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/webp" href="../assets/img/favicon.webp">
    <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.webp">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craft Message - Dialogika</title>
    
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet" />

    <style>


        
        
        body { }
        
        
        .main-content {
            margin-left: 290px;
            width: calc(100% - 290px);
            padding: 40px;
            min-height: 100vh;
        }

        @media (max-width: 991px) {
            .main-content { margin-left: 0; width: 100%; padding: 20px; }
        }

        
        .project-context-card {
            max-width: 800px;
            width: 90%;
            background-color: var(--surface); 
            color: white;
            margin: 20px auto -20px auto;
            padding: 20px 25px 40px 25px;
            border-radius: 16px 16px 0 0;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
        } 

        
        .main-list-card {
            max-width: 1000px;
            width: 100%;
            background: var(--surface);
            border-radius: 16px;
            box-shadow: 0 10px 40px -5px rgba(0, 0, 0, 0.3);
            margin: 0 auto 50px auto;
            padding: 50px 60px;
            position: relative;
            z-index: 2;
            border: 0px;
        }

        .task-create-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            margin-top: 15px;
            display: none;
        }
        .task-title-large {
            font-size: 1.5rem;
            font-weight: 700;
            border: none;
            outline: none;
            width: 100%;
            margin-bottom: 15px;
        }

        .status-badge-main {
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            color: white;
        }
        .status-drag-container {
            min-height: 50px;
            background: var(--surface-muted);
            border-radius: 8px;
            padding: 10px;
        }

        .meta-grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 30px;
        }
        .meta-field-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .meta-label-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .meta-label-text {
            font-size: 0.8rem;
            color: var(--text-faint);
        }
        .meta-value {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 6px;
            flex: 1;
        }
        .ghost-input {
            border: 1px solid transparent;
            background: transparent;
            padding: 5px;
            width: 100%;
            border-radius: 4px;
        }
        .ghost-input:hover { background: var(--surface-hover); }

        .priority-dropdown {
            position: relative;
            width: 100%;
        }
        .priority-trigger {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            border-radius: 8px;
            border: 1px solid var(--border-strong);
            padding: 6px 10px;
            background: var(--surface-muted);
            cursor: pointer;
            font-size: 0.9rem;
        }
        .priority-trigger:hover {
            background: #eef2ff;
        }
        .priority-menu {
            position: absolute;
            top: 100%;
            left: 0;
            margin-top: 4px;
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(15,23,42,0.15);
            padding: 6px 0;
            min-width: 180px;
            z-index: 1050;
            display: none;
        }
        .priority-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .priority-item:hover {
            background: var(--surface-hover);
        }
        .priority-flag {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            color: white;
            font-size: 0.75rem;
        }
        .priority-flag-urgent { background: #ef4444; }
        .priority-flag-high { background: #f59e0b; }
        .priority-flag-normal { background: #3b82f6; }
        .priority-flag-low { background: #6b7280; }

        .user-select {
            position: relative;
            width: 100%;
        }
        .user-select-control {
            display: flex;
            align-items: center;
            width: 100%;
            min-height: 34px;
            border-radius: 8px;
            border: 1px solid var(--border-strong);
            padding: 6px 10px;
            background: var(--surface-muted);
            cursor: pointer;
            gap: 8px;
        }
        .user-select-control:hover {
            background: #f3f4ff;
        }
        .user-select-avatar {
            width: 22px;
            height: 22px;
            border-radius: 999px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface-hover-strong);
            flex-shrink: 0;
        }
        .user-select-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .user-select-placeholder {
            font-size: 0.85rem;
            color: var(--text-faint);
        }
        .user-select-name {
            font-size: 0.85rem;
            color: var(--text-strong);
        }
        .user-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            margin-top: 6px;
            background: #0f172a;
            color: white;
            border-radius: 18px;
            padding: 10px 10px 8px 10px;
            box-shadow: 0 18px 45px rgba(15,23,42,0.45);
            width: 280px;
            z-index: 60;
            display: none;
        }
        .user-search-wrapper {
            display: flex;
            align-items: center;
            background: #020617;
            border-radius: 999px;
            padding: 4px 10px;
            gap: 6px;
            margin-bottom: 8px;
        }
        .user-search-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            color: #e5e7eb;
            font-size: 0.85rem;
        }
        .user-search-input::placeholder {
            color: var(--text-muted-2);
        }
        .user-list-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-faint);
            margin: 4px 2px 4px 2px;
        }
        .user-list {
            max-height: 260px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .user-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 4px;
            border-radius: 8px;
            cursor: pointer;
        }
        .user-option:hover {
            background: #111827;
        }
        .user-option-avatar {
            width: 28px;
            height: 28px;
            border-radius: 999px;
            overflow: hidden;
            flex-shrink: 0;
            background: #1f2937;
        }
        .user-option-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .user-option-name {
            font-size: 0.85rem;
        }

        
        .desc-more-link {
            color: var(--dlg-blue);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
            margin-left: 5px;
        }
        .desc-more-link:hover { text-decoration: underline; }

        
        .todo-group-label {
            font-size: 1.1rem; font-weight: 800; color: var(--text);
            margin-top: 40px; margin-bottom: 15px; border-bottom: 3px solid #1f2937;
            display: inline-block; padding-bottom: 2px;
        }
        
        .todo-row {
            display: flex; align-items: flex-start; padding: 12px 0;
            border-bottom: 1px solid #f3f4f6; transition: 0.2s;
            font-size: 1.05rem; cursor: pointer;
        }
        .todo-row:hover { background-color: var(--surface-muted); padding-left: 10px; border-radius: 5px; margin-left: -10px; }
        
        .todo-check {
            width: 24px; height: 24px; margin-right: 15px; margin-top: 3px; cursor: pointer;
            border: 2px solid var(--border-sep); border-radius: 6px;
        }
        .todo-text { color: var(--text); font-weight: 500; }
        .todo-row.completed .todo-text { text-decoration: line-through; color: var(--text-faint); }
        .drag-handle-task { color: #cbd5e1; margin-left: 8px; cursor: grab; }
        .btn.btn-sm.btn-outline-primary.px-2.py-0.small:hover {
            color: #fff; border: none; transition: 0.3s;
            background: linear-gradient(to bottom, #0f61a8 5%, #0b2b6a 100%);
            box-shadow: 0px 5px 16px -6px rgba(114, 4, 207, 1);
            -webkit-box-shadow: 0px 5px 16px -6px rgba(114, 4, 207, 1);
        }
        .btn.btn-sm.btn-outline-danger.px-2.py-0.small:hover {
            color: #fff; border: none; transition: 0.3s;
            background: linear-gradient(to bottom, #e7181b 5%, #a31818 100%);
            box-shadow: 0px 5px 16px -6px rgba(114, 4, 207, 1);
            -webkit-box-shadow: 0px 5px 16px -6px rgba(114, 4, 207, 1);
        }

        @media (max-width: 768px) {
            .main-list-card { padding: 30px 20px; }
        }
        
    

</style>

    <!-- Centralized Auth Guard -->
    <script type="module" src="../assets/js/auth-guard.js"></script>
</head>
<body style="background-color: #f1f7fd;">

    <!-- 1. TOP BAR FIXED -->
    <div id="topbarContainer"></div>

    <div class="dashboard-container">
        
        <div id="sidebarContainer"></div>

        <!-- 3. MAIN CONTENT -->
        <main class="main-content">
            
            <!-- A. KARTU BELAKANG (BREADCRUMB NAV) -->
            <div class="project-context-card">
                <!-- Badge (Akan diisi JS) -->
                <div class="ph-badge" id="projectBadge">Loading...</div>

                <!-- Breadcrumb Navigation -->
                <div class="ph-crumb-container">
                    <!-- 1. Home -->
                    <a href="../home.html" class="ph-crumb-link" title="Dashboard">
                        <i class="bi bi-house-fill"></i>
                    </a>
                    
                    <i class="bi bi-chevron-right ph-sep"></i>

                    <!-- 2. Project Name -->
                    <a href="#" id="breadProjectLink" class="ph-crumb-link">...</a>

                    <i class="bi bi-chevron-right ph-sep"></i>

                    <!-- 3. All Lists -->
                    <a href="#" id="breadAllListLink" class="ph-crumb-link">Messages</a>
                </div>

                <!-- Right Option -->
                <div class="position-absolute end-0 me-3">
                    <button class="btn btn-link text-white text-opacity-50"><i class="bi bi-three-dots"></i></button>
                </div>
            </div>

                <div class="main-list-card">
                    <div id="commentsContainer" style="display:none;"></div>

                    <div class="mb-4 d-flex justify-content-between align-items-center">
                        <div class="dropdown">
                            <button class="btn btn-light border rounded-pill px-3 py-1 d-flex align-items-center gap-2 btn-sm"
                                    type="button"
                                    id="messageCategoryDropdown"
                                    data-bs-toggle="dropdown"
                                    aria-expanded="false">
                                <span class="small text-muted">Pick a category</span>
                                <span class="d-inline-flex flex-column" style="line-height:0;">
                                    <i class="bi bi-caret-up-fill" style="font-size:0.55rem;"></i>
                                    <i class="bi bi-caret-down-fill" style="font-size:0.55rem; margin-top:-2px;"></i>
                                </span>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-start shadow-sm" aria-labelledby="messageCategoryDropdown">
                                <li><button class="dropdown-item small" type="button" data-category="urgent">Urgent</button></li>
                                <li><button class="dropdown-item small" type="button" data-category="updates">Updates</button></li>
                                <li><button class="dropdown-item small" type="button" data-category="question">Question</button></li>
                            </ul>
                        </div>
                    </div>

                    <div class="mb-3">
                        <input type="text"
                               id="messageTitleInput"
                               class="form-control border-0 px-0"
                               placeholder="Type a title..."
                               style="font-size:2rem; font-weight:600; box-shadow:none;">
                    </div>

                    <div class="mb-4">
                        <div class="rich-editor" style="position:relative;">
                            <div class="rich-toolbar">
                                <button type="button" class="rich-btn" onclick="applyFormat('commentInput','bold')"><i class="bi bi-type-bold"></i></button>
                                <button type="button" class="rich-btn" onclick="applyFormat('commentInput','italic')"><i class="bi bi-type-italic"></i></button>
                                <button type="button" class="rich-btn" onclick="applyFormat('commentInput','underline')"><i class="bi bi-type-underline"></i></button>
                                <button type="button" class="rich-btn" onclick="applyFormat('commentInput','insertUnorderedList')"><i class="bi bi-list-ul"></i></button>
                                <button type="button" class="rich-btn" onclick="applyFormat('commentInput','insertOrderedList')"><i class="bi bi-list-ol"></i></button>
                                <button type="button" class="rich-btn" onclick="applyBlockquote('commentInput')"><i class="bi bi-chat-right-quote"></i></button>
                                <button type="button" class="rich-btn ms-auto" onclick="triggerCommentFileInput()"><i class="bi bi-paperclip"></i></button>
                            </div>
                            <div id="commentInput" class="rich-editor-body" contenteditable="true" data-placeholder="Write away..."></div>
                            <div id="mentionDropdown" class="bg-white border rounded shadow-sm small" style="position:absolute; z-index:1050; display:none; max-height:200px; overflow-y:auto; min-width:180px;"></div>
                        </div>
                        <div id="commentAttachmentPreview" class="small text-muted mb-2"></div>
                        <input type="file" id="comment-file-input" multiple style="display:none">
                    </div>

                    <div class="mt-4 pt-4 border-top">
                        <p class="small fw-semibold mb-2">When I post this, notify...</p>
                        <div class="mb-3">
                            <div class="form-check mb-1">
                                <input class="form-check-input" type="radio" name="notifyOption" id="notifyAll" checked>
                                <label class="form-check-label small" for="notifyAll">
                                    All people who can see this project
                                </label>
                            </div>
                            <div class="ps-4 mb-2">
                                <div class="d-flex align-items-center gap-1 flex-wrap" id="subsContainer"></div>
                            </div>
                            <div class="form-check mb-1">
                                <input class="form-check-input" type="radio" name="notifyOption" id="notifySelected">
                                <label class="form-check-label small" for="notifySelected">
                                    Only the people I select...
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="notifyOption" id="notifyNone">
                                <label class="form-check-label small" for="notifyNone">
                                    No one
                                </label>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="d-none">
                                <span id="subscriptionStatusText"></span>
                                <button id="subscriptionToggleButton" type="button" onclick="toggleSubscription()"></button>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="button" class="btn btn-outline-success rounded-pill px-4 btn-sm" id="saveDraftButton" style="border-color: #006a4e; ">
                                    Save as a draft
                                </button>
                                <button type="button" class="btn btn-dlg-green rounded-pill px-4 btn-sm" id="postMessageButton" onclick="postComment('list')">
                                    Post this message
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
        </main>
    </div>

    <div class="modal fade" id="manageSubscribersModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0">
                <div class="modal-header border-0 p-4 pb-0">
                    <h5 class="fw-bold">Manage Subscribers</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="input-group mb-3 bg-light rounded-pill px-2">
                        <span class="input-group-text bg-transparent border-0"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control bg-transparent border-0 shadow-none" placeholder="Search people..." oninput="renderManageSubscriberList(this.value)">
                    </div>
                    <div id="subscriberListScroll" style="max-height: 400px; overflow-y: auto;"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="commentEditModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0">
                <div class="modal-header border-0 p-4 pb-0">
                    <h5 class="fw-bold">Edit Comment</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <textarea id="commentEditText" class="form-control" rows="4" placeholder="Update your comment..."></textarea>
                    <input type="hidden" id="commentEditId">
                </div>
                <div class="modal-footer border-0 p-3 pt-0">
                    <button type="button" class="btn btn-light rounded-pill px-3" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-dlg-blue rounded-pill px-3" onclick="confirmEditComment()">Save changes</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="commentDeleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0">
                <div class="modal-header border-0 p-4 pb-0">
                    <h5 class="fw-bold text-danger">Delete Comment</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <p class="mb-2">Are you sure you want to delete this comment?</p>
                    <p id="commentDeletePreview" class="small text-muted mb-0"></p>
                    <input type="hidden" id="commentDeleteId">
                </div>
                <div class="modal-footer border-0 p-3 pt-0">
                    <button type="button" class="btn btn-light rounded-pill px-3" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger rounded-pill px-3" onclick="confirmDeleteComment()">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="commentInfoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0">
                <div class="modal-body p-4 text-center">
                    <p id="commentInfoMessage" class="mb-0"></p>
                </div>
                <div class="modal-footer border-0 p-3 pt-0 justify-content-center">
                    <button type="button" class="btn btn-dlg-blue rounded-pill px-4" data-bs-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { renderTopBar } from "../element/topbar.js";
        import { renderSidebar } from "../element/sidebar.js";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { app, auth, db, storage } from "../assets/js/firebase-config.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import {
            getFirestore,
            doc,
            collection,
            getDoc,
            getDocs,
            query,
            where,
            orderBy,
            addDoc,
            updateDoc,
            deleteDoc,
            setDoc,
            onSnapshot,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import {
            getStorage,
            ref as storageRef,
            uploadBytes,
            getDownloadURL
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        

        window.db = db;
        window.auth = auth;
        window.collection = collection;
        window.getDoc = getDoc;
        window.getDocs = getDocs;
        window.addDoc = addDoc;
        window.updateDoc = updateDoc;
        window.deleteDoc = deleteDoc;
        window.setDoc = setDoc;
        window.doc = doc;
        window.serverTimestamp = serverTimestamp;
        window.storage = storage;
        window.ref = storageRef;
        window.uploadBytes = uploadBytes;
        window.getDownloadURL = getDownloadURL;

        const topbarTarget = document.getElementById('topbarContainer');
        renderTopBar(topbarTarget);

        const sidebarTarget = document.getElementById('sidebarContainer');
        renderSidebar(sidebarTarget);

        const DEFAULT_LIST_STATUSES = [
            { name: "Initiate", color: "#0B2B6A", type: "not_started", position: 0 },
            { name: "Complete", color: "#006a4e", type: "done", position: 1 }
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('projectId') || urlParams.get('id');
        const listId = urlParams.get('listId');
        const messageId = urlParams.get('messageId');
        const draftId = urlParams.get('draftId');

        const tasksWrapper = document.querySelector('.todo-list-wrapper');
        const titleEl = document.getElementById('listTitleDisplay');
        const badgeEl = document.getElementById('projectBadge');
        const commentsContainer = document.getElementById('commentsContainer');
        const subsContainer = document.getElementById('subsContainer');
        const breadProjectLink = document.getElementById('breadProjectLink');
        const breadAllListLink = document.getElementById('breadAllListLink');
        const subscriptionStatusText = document.getElementById('subscriptionStatusText');
        const subscriptionToggleButton = document.getElementById('subscriptionToggleButton');
        const commentAvatar = document.getElementById('commentAvatar');
        const manageSubsScroll = document.getElementById('subscriberListScroll');
        const listDescWrapper = document.getElementById('listDescWrapper');
        const listDescEditorWrapper = document.getElementById('listDescEditorWrapper');
        const listDescEditor = document.getElementById('listDescEditor');

        let currentUser = null;
        let listTasks = [];
        let currentListData = null;
        let currentSubscribers = [];
        let projectMembers = [];
        let manageSubscriberSearchQuery = "";
        let currentComments = [];
        let pendingCommentFiles = [];
        let isEditingTitle = false;
        let isEditingDescription = false;
        let replyTargetCommentId = null;
        let mentionRange = null;
        let mentionActive = false;
        let mentionQuery = "";
        let mentionDropdownElement = null;
        let currentMessageCategory = "";
        let currentEditingMessage = null;
        let currentDraftId = null;

        function getDirectPhotoUrl(url, uid) {
            if (!url) return `https://i.pravatar.cc/150?u=${uid || "user"}`;
            if (url.includes('drive.google.com')) {
                let id = "";
                if (url.includes('id=')) {
                    id = url.split('id=')[1].split('&')[0];

                    id = url.split('/d/')[1].split('/')[0];
                }
                if (id) return `https://lh3.googleusercontent.com/u/0/d/${id}`;
            }
            return url;
        }

        async function loadProjectMembers(memberUids) {
            projectMembers = [];
            try {
                const snap = await getDocs(collection(db, "users"));
                const allUsers = [];
                snap.forEach(docSnap => {
                    const u = docSnap.data() || {};
                    allUsers.push({
                        uid: docSnap.id,
                        name: u.name || u.email || "Unknown",
                        email: u.email || "",
                        photo: getDirectPhotoUrl(u.photo || "", docSnap.id)
                    });
                });
                const currentUid = getCurrentUserUid();
                allUsers.sort((a, b) => {
                    if (a.uid === currentUid) return -1;
                    if (b.uid === currentUid) return 1;
                    return a.name.localeCompare(b.name);
                });
                projectMembers = allUsers;
            } catch (e) {
                console.error("Failed to load project members", e);
                if (Array.isArray(memberUids) && memberUids.length > 0) {
                    try {
                        const promises = memberUids.map(async (uid) => {
                            const snap = await getDoc(doc(db, "users", uid));
                            if (snap.exists()) {
                                const u = snap.data();
                                return {
                                    uid,
                                    name: u.name || u.email || "Unknown",
                                    email: u.email || "",
                                    photo: getDirectPhotoUrl(u.photo || "", uid)
                                };
                            }
                            return null;
                        });
                        const results = await Promise.all(promises);
                        projectMembers = results.filter(Boolean);
                    } catch (err2) {
                        console.error("Fallback failed when loading project members", err2);
                    }
                }
            }
            populateDetailUserOptions();

        const TAG_COLORS = [
            "#bfdbfe", "#e0f2fe", "#a5f3fc", "#bbf7d0", "#dcfce7", "#fef9c3", "#fee2e2", "#fecaca",
            "#ddd6fe", "#e9d5ff", "#f5d0fe", "#fce7f3", "#fee2e2", "#ffedd5", "#d1fae5", "#bae6fd",
            "#e5e7eb", "#d1d5db", "#f9a8d4", "#fda4af", "#fdba74", "#bef264", "#a7f3d0", "#67e8f9"
        ];

        function getDefaultTagColor(name) {
            if (!name) return "#e5e7eb";
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = ((hash << 5) - hash) + name.charCodeAt(i);
                hash |= 0;
            }
            const index = Math.abs(hash) % TAG_COLORS.length;
            return TAG_COLORS[index];
        }

        function getTagColorOverrides() {
            const key = `tagColors:${projectId}`;
            try {
                const raw = localStorage.getItem(key);
                if (!raw) return {};
                const parsed = JSON.parse(raw);
                if (parsed && typeof parsed === "object") return parsed;
                return {};
            } catch {
                return {};
            }
        }

        function getTagColor(name) {
            const overrides = getTagColorOverrides();
            if (overrides && overrides[name]) return overrides[name];
            return getDefaultTagColor(name);
        }

        async function loadTasks() {
            try {
                const q = query(
                    collection(db, "tasks"),
                    where("project_id", "==", projectId)
                );
                const snap = await getDocs(q);
                const tasks = [];
                const tagSet = new Set();
                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    if (Array.isArray(data.tags)) {
                        data.tags.forEach(tag => {
                            if (tag && typeof tag === "string") tagSet.add(tag);
                        });
                    }
                    if (data.list_id === listId) {
                        tasks.push({ id: docSnap.id, ...data });
                    }
                });
                tasks.sort((a, b) => {
                    const pa = typeof a.position === "number" ? a.position : 0;
                    const pb = typeof b.position === "number" ? b.position : 0;
                    return pa - pb;
                });
                listTasks = tasks;
                renderTasks(listTasks);
                updateAllDoneBadge();
                populateDetailTagOptionsFromTasks(Array.from(tagSet));
                updateSelectedTagUIDetail();
                initTaskSortableDetail();
            } catch (e) {
                console.error("Failed to load tasks", e);
                if (tasksWrapper) {
                    tasksWrapper.innerHTML = '<div class="alert alert-danger text-center">Gagal mengambil data tasks.</div>';
                }

                statuses = list.statuses.slice().sort((a, b) => {
                    const pa = typeof a.position === "number" ? a.position : 0;
                    const pb = typeof b.position === "number" ? b.position : 0;
                    return pa - pb;
                });

                statuses = DEFAULT_LIST_STATUSES.slice();
            }
            statuses.forEach(s => {

        function renderTasks(tasks) {
            tasksWrapper.innerHTML = '';
            if (!tasks || tasks.length === 0) {
                tasksWrapper.innerHTML = '<div class="text-muted fst-italic text-center py-3">No tasks yet.</div>';
                return;
            }

            tasks.forEach(task => {
                const isDone = ['done', 'completed', 'complete', 'true'].includes(String(task.status).toLowerCase());
                const statusText = task.status || '';
                const tags = Array.isArray(task.tags) ? task.tags.filter(t => !!t) : [];
                let statusColor = '#0B2B6A';
                if (currentListData) {
                    const rawStatuses = Array.isArray(currentListData.statuses) && currentListData.statuses.length > 0
                        ? currentListData.statuses
                        : DEFAULT_LIST_STATUSES;
                    const currentStatusName = String(task.status || '').toLowerCase();
                    const found = rawStatuses.find(s => String(s.name || '').toLowerCase() === currentStatusName);
                    if (found && found.color) statusColor = found.color;
                }
                const tagsHtml = tags.map(tag => {
                    const color = getTagColor(tag);
                    return `<span class="badge border small me-1" style="background:${color}; color:#111827;">
                                <i class="bi bi-tag text-muted me-1"></i>${tag}
                            </span>`;
                }).join('');
                
                const itemHtml = `
                    <div class="todo-row ${isDone ? 'completed' : ''} d-flex align-items-start" 
                         id="task-${task.id}"
                         onclick="handleTaskRowClickDetail(event, '${task.id}')">
                        
                        <input type="checkbox" class="todo-check" ${isDone ? 'checked' : ''} 
                               onclick="event.stopPropagation()" 
                               onchange="handleStatusChange('${task.id}', this)">
                        
                        <div class="w-100">
                            <div class="todo-text">
                                ${task.title}
                                ${task.description ? `<i class="bi bi-filter-left ms-2 text-muted"></i>` : ''}
                            </div>
                            <small class="text-muted" style="font-size:0.75rem">Click to see details</small>
                            <div class="mt-1" style="font-size:0.7rem">
                                ${statusText ? `<span class="badge border small me-2" style="background:${statusColor}; color:#ffffff;">
                                                    <i class="bi bi-record-circle text-white me-1"></i>${statusText}

                            </div>
                        </div>
                        <i class="bi bi-list drag-handle-task"></i>

                tasksWrapper.insertAdjacentHTML('beforeend', itemHtml);

        function normalizeTimestamp(value) {
            if (!value) return null;
            if (value.toDate) return value.toDate();
            if (value instanceof Date) return value;
            const d = new Date(value);
            return isNaN(d.getTime()) ? null : d;
        }

        function getCurrentUserUid() {
            try {
                if (currentUser && currentUser.uid) return currentUser.uid;
                const localData = JSON.parse(localStorage.getItem('userData') || 'null');
                if (localData && localData.uid) return localData.uid;

            return "";

        function canEditComment(c) {
            const uid = getCurrentUserUid();
            if (!uid) return false;
            const owner = c.user_id || c.userId || "";
            return uid === owner;
        }

        function getPlainCommentText(c) {
            if (!c) return "";
            if (typeof c.text_plain === 'string') return c.text_plain;
            if (typeof c.text === 'string') return c.text.replace(/<[^>]*>/g, ' ');
            return "";
        }

        function placeCaretAtEnd(el) {
            if (!el) return;
            const range = document.createRange();
            range.selectNodeContents(el);
            range.collapse(false);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
        }

        function startEditListTitle() {
            if (!titleEl || isEditingTitle) return;
            isEditingTitle = true;
            titleEl.setAttribute('contenteditable', 'true');
            titleEl.dataset.editing = '1';
            placeCaretAtEnd(titleEl);
            const handleKeyDown = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    finishEditListTitle(true);
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    finishEditListTitle(false);
                }
            };
            const handleBlur = () => {
                finishEditListTitle(true);
            };
            titleEl.addEventListener('keydown', handleKeyDown);
            titleEl.addEventListener('blur', handleBlur, { once: true });
            titleEl.dataset.keyHandler = '1';
        }

        async function finishEditListTitle(save) {
            if (!titleEl) {
                isEditingTitle = false;
                return;
            }
            const newTitle = (titleEl.innerText || '').trim();
            const original = currentListData && currentListData.name ? currentListData.name : "";
            let finalTitle = original || "Untitled List";
            if (save && newTitle && newTitle !== original && currentListData) {
                try {
                    const listRef = doc(db, "projects", projectId, "lists", listId);
                    await updateDoc(listRef, { name: newTitle });
                    currentListData.name = newTitle;
                    finalTitle = newTitle;
                } catch (e) {
                    console.error("Failed to update list title", e);
                }
            }
            titleEl.innerText = finalTitle;
            titleEl.removeAttribute('contenteditable');
            delete titleEl.dataset.editing;
            isEditingTitle = false;

                           <img src="${photo}" alt="${userName}" style="width:100%; height:100%; object-fit:cover;">

                    : `<div class="rounded-circle bg-secondary text-white d-flex align-items-center justify-content-center fw-bold flex-shrink-0" style="width:40px; height:40px;">
                           ${initials}
                       </div>`;
                const canEdit = canEditComment(c);
            });

            const commentById = {};
            comments.forEach(c => {
                commentById[c.id] = c;
            });

            const childrenMap = {};
            comments.forEach(c => {
                const parentId = c.parent_comment_id || c.parentCommentId || null;
                if (parentId) {
                    if (!childrenMap[parentId]) childrenMap[parentId] = [];
                    childrenMap[parentId].push(c);
                }
            });

            const roots = comments.filter(c => {
                const parentId = c.parent_comment_id || c.parentCommentId || null;
                if (!parentId) return true;
                return !commentById[parentId];
            });

            function renderCommentTree(c, depth) {
                const createdAt = normalizeTimestamp(c.created_at || c.createdAt);
                const dateStr = createdAt ? createdAt.toLocaleString() : 'Just now';
                const userId = c.user_id || c.userId || '';
                const userName = c.user_name || c.userName || userId || 'User';
                const initialsSource = c.user_initials || userName || userId || '';
                const initials = initialsSource
                    ? initialsSource.trim().split(' ').map(part => part[0]).join('').substring(0, 2).toUpperCase()
                    : '??';
                const photo = c.user_photo || "";
                const attachments = Array.isArray(c.attachments) ? c.attachments : [];
                const attachmentsHtml = attachments.length
                    ? `<div class="mt-2 small">${attachments.map(a => `<a href="${a.url}" target="_blank" rel="noopener" class="me-2"><i class="bi bi-paperclip me-1"></i>${a.name}</a>`).join('')}</div>`
                    : '';
                const avatar = photo
                    ? `<div class="rounded-circle d-flex align-items-center justify-content-center fw-bold flex-shrink-0 overflow-hidden" style="width:40px; height:40px;">
                           <img src="${photo}" alt="${userName}" style="width:100%; height:100%; object-fit:cover;">
                       </div>`
                    : `<div class="rounded-circle bg-secondary text-white d-flex align-items-center justify-content-center fw-bold flex-shrink-0" style="width:40px; height:40px;">
                           ${initials}
                       </div>`;
                const canEdit = canEditComment(c);
                const actions = [];
                actions.push(`
                    <button class="btn btn-sm btn-outline-primary px-2 py-0 small"
                            style="border-color:#0B2B6A; color:#0B2B6A;"
                            onclick="replyToComment('${c.id}')">
                        Reply
                    </button>
                `);
                if (canEdit) {
                    actions.push(`
                        <button class="btn btn-sm btn-outline-primary px-2 py-0 small"
                                style="border-color:#0B2B6A; color:#0B2B6A;"
                                onclick="editComment('${c.id}')">
                            Edit
                        </button>
                    `);
                    actions.push(`
                        <button class="btn btn-sm btn-outline-danger px-2 py-0 small"
                                style="border-color:#e7181a; color:#e7181a;"
                                onclick="deleteComment('${c.id}')">
                            Delete
                        </button>
                    `);
                }
                const actionsHtml = actions.length
                    ? `<div class="mt-1 d-flex gap-2">${actions.join('')}</div>`
                    : '';
                const parentId = c.parent_comment_id || c.parentCommentId || null;
                const parent = parentId ? commentById[parentId] : null;
                const parentName = parent ? (parent.user_name || parent.userName || '') : '';
                const replyingHtml = parentName
                    ? `<div class="small text-muted mb-1">Replying to <strong>${parentName}</strong></div>`
                    : '';
                const indentClass = depth > 0 ? ' ms-5' : '';
                const marginClass = depth > 0 ? 'mb-2' : 'mb-3';
                const html = `
                    <div class="d-flex gap-3 ${marginClass}${indentClass}">
                        ${avatar}
                        <div class="bg-white border rounded p-3 w-100 shadow-sm">
                            <div class="d-flex justify-content-between mb-1">
                                <strong class="small text-dark">${userName}</strong>
                                <small class="text-muted" style="font-size:0.7rem">${dateStr}</small>
                            </div>
                            ${replyingHtml}
                            <div class="text-dark small" id="comment-text-${c.id}">${c.text || ''}</div>
                            ${attachmentsHtml}
                            ${actionsHtml}
                        </div>
                    </div>
                `;
                commentsContainer.insertAdjacentHTML('beforeend', html);
                const children = childrenMap[c.id] || [];
                children.forEach(child => renderCommentTree(child, depth + 1));
            }

            roots.forEach(root => {
                renderCommentTree(root, 0);
            });
        }

        function stopMention() {
            mentionActive = false;
            mentionQuery = "";
            mentionRange = null;
            if (mentionDropdownElement) {
                mentionDropdownElement.style.display = "none";
                mentionDropdownElement.innerHTML = "";
            }
        }

        function handleCommentKeyDown(e) {
            if (mentionActive && e.key === "Escape") {
                e.preventDefault();
                stopMention();
            }
        }

        function handleCommentKeyUp(e) {
            const editor = e.currentTarget;
            const key = e.key;
            if (key === "@") {
                const sel = window.getSelection();
                if (!sel || !sel.rangeCount) return;
                const range = sel.getRangeAt(0);
                if (!editor.contains(range.startContainer)) return;
                const r = range.cloneRange();
                const startOffset = Math.max(0, r.startOffset - 1);
                r.setStart(r.startContainer, startOffset);
                mentionRange = r;
                mentionActive = true;
                mentionQuery = "";
                updateMentionDropdown(editor);
                return;
            }

            if (!mentionActive) return;

            if (key === "Escape" || key === " " || key === "Enter" || key === "Tab") {
                stopMention();
                return;
            }

            const sel = window.getSelection();
            if (!sel || !sel.rangeCount) {
                stopMention();
                return;
            }
            const range = sel.getRangeAt(0);
            if (!editor.contains(range.startContainer) || !mentionRange) {
                stopMention();
                return;
            }
            if (mentionRange.startContainer !== range.startContainer) {
                stopMention();
                return;
            }
            mentionRange.setEnd(range.startContainer, range.startOffset);
            const node = mentionRange.startContainer;
            const text = node.textContent || "";
            const start = mentionRange.startOffset;
            const end = mentionRange.endOffset;
            if (end <= start || start < 0 || end > text.length) {
                stopMention();
                return;
            }
            if (text[start] !== "@") {
                stopMention();
                return;
            }
            mentionQuery = text.substring(start + 1, end);
            updateMentionDropdown(editor);
        }

        function updateMentionDropdown(editor) {
            if (!mentionDropdownElement) return;
            if (!mentionActive) {
                mentionDropdownElement.style.display = "none";
                mentionDropdownElement.innerHTML = "";
                return;
            }
            const query = (mentionQuery || "").toLowerCase();
            let candidates = Array.isArray(projectMembers) ? projectMembers.slice() : [];
            if (query) {
                candidates = candidates.filter(m => {
                    const name = (m.name || "").toLowerCase();
                    const email = (m.email || "").toLowerCase();
                    return name.includes(query) || email.includes(query);
                });
            }
            if (!candidates.length) {
                mentionDropdownElement.style.display = "none";
                mentionDropdownElement.innerHTML = "";
                return;
            }
            const itemsHtml = candidates.map(m => {
                const name = m.name || m.email || m.uid;
                const email = m.email ? ` <span class="text-muted small">(${m.email})</span>` : "";
                return `<div class="px-2 py-1 mention-item" style="cursor:pointer;" onclick="selectMention('${m.uid}')">${name}${email}</div>`;
            }).join("");
            mentionDropdownElement.innerHTML = itemsHtml;
            const sel = window.getSelection();
            if (!sel || !sel.rangeCount) {
                mentionDropdownElement.style.display = "none";
                return;
            }
            const range = sel.getRangeAt(0).cloneRange();
            const rect = range.getBoundingClientRect();
            const container = editor.closest('.rich-editor') || editor.parentElement || editor;
            const containerRect = container.getBoundingClientRect();
            const left = rect.left - containerRect.left;
            const top = rect.bottom - containerRect.top + 4;
            mentionDropdownElement.style.left = `${left}px`;
            mentionDropdownElement.style.top = `${top}px`;
            mentionDropdownElement.style.display = "block";
        }

        window.selectMention = function (uid) {
            const editor = document.getElementById('commentInput');
            if (!editor || !mentionRange) {
                stopMention();
                return;
            }
            const member = (projectMembers || []).find(m => m.uid === uid);
            if (!member) {
                stopMention();
                return;
            }
            const name = member.name || member.email || uid;
            const span = document.createElement('span');
            span.className = 'comment-mention';
            span.setAttribute('data-mention-uid', uid);
            span.setAttribute('data-mention-name', name);
            span.textContent = '@' + name;
            const space = document.createTextNode('\u00A0');
            const fragment = document.createDocumentFragment();
            fragment.appendChild(span);
            fragment.appendChild(space);
            mentionRange.deleteContents();
            mentionRange.insertNode(fragment);
            const sel = window.getSelection();
            if (sel) {
                sel.removeAllRanges();
                const afterRange = document.createRange();
                afterRange.setStartAfter(space);
                afterRange.setEndAfter(space);
                sel.addRange(afterRange);
            }
            stopMention();
        };
