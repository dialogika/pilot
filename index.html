<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/webp" href="assets/img/favicon.webp">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.webp">
  <title>Login — Team Dialogika</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/layout.css">
</head>
<body>
  <div class="dg-login-shell">
    <div class="dg-login-card">
      <div class="text-center mb-4">
        <img src="https://www.dialogika.co/assets/img/logo.webp" alt="Dialogika Logo" height="40" class="mb-3">
        <h4 class="mb-1">Masuk ke Team Dialogika</h4>
        <p class="text-body-secondary small mb-0">team.dialogika.co</p>
      </div>

      <div id="errorMessage" class="alert alert-danger py-2 small d-none"></div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label small" for="email">Email</label>
          <input type="email" id="email" class="form-control" placeholder="nama@email.com" required autocomplete="username">
        </div>
        <div class="mb-3">
          <label class="form-label small" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Masukkan password" required autocomplete="current-password">
        </div>
        <button type="submit" id="submitBtn" class="btn btn-primary w-100">Masuk</button>
      </form>

      <div class="d-flex justify-content-between align-items-center mt-3 small">
        <a href="#" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">Lupa Password?</a>
        <a href="register.html">Daftar</a>
      </div>
    </div>
  </div>

  <!-- Modal Forgot Password -->
  <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Reset Password</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="small text-body-secondary">Masukkan email yang terdaftar, kami akan mengirim tautan untuk mengatur ulang password.</p>
          <div id="forgotErrorMessage" class="alert alert-danger py-2 small d-none"></div>
          <div id="forgotSuccessMessage" class="alert alert-success py-2 small d-none"></div>
          <form id="forgotPasswordForm">
            <div class="mb-3">
              <label class="form-label small" for="forgotEmail">Email</label>
              <input type="email" id="forgotEmail" class="form-control" placeholder="nama@email.com" required>
            </div>
            <button type="submit" id="forgotSubmitBtn" class="btn btn-primary w-100">Kirim Link Reset</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { signInWithEmailAndPassword, signOut, sendPasswordResetEmail, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { auth, db } from "./assets/js/firebase-config.js";

    // Jika sudah login, langsung lanjut ke dashboard.
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = "home.html";
      }
    });

    const form = document.getElementById("loginForm");
    const submitBtn = document.getElementById("submitBtn");
    const errorMsg = document.getElementById("errorMessage");

    // --- PROSES LOGIN ---
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Memeriksa...';
      errorMsg.classList.add("d-none");

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // Ambil profil dari Firestore berdasarkan UID.
        const userDoc = await getDoc(doc(db, "users", user.uid));

        if (userDoc.exists()) {
          const userData = userDoc.data();

          // Cek apakah akun aktif.
          if (userData.status !== "Active") {
            await signOut(auth);
            throw new Error("account_inactive");
          }

          // Simpan profil untuk keperluan tampilan (bukan untuk keputusan auth).
          localStorage.setItem("userData", JSON.stringify({
            uid: user.uid,
            name: userData.name,
            photo: userData.photo,
            email: userData.email,
            position: userData.employment && userData.employment.position,
          }));

          // Catat presence (online).
          try {
            await setDoc(doc(db, "user_presence", user.uid), {
              user_id: user.uid,
              name: userData.name || user.email,
              photo: userData.photo || "",
              last_active_at: serverTimestamp(),
            }, { merge: true });
          } catch (err) {
            console.error("Failed to record login presence", err);
          }

          submitBtn.innerHTML = "Login Berhasil!";
          setTimeout(() => { window.location.href = "home.html"; }, 500);
        } else {
          const pendingDoc = await getDoc(doc(db, "pending_users", user.uid));
          if (pendingDoc.exists()) {
            await signOut(auth);
            throw new Error("pending_approval");
          }
          throw new Error("Profil tidak ditemukan di database.");
        }
      } catch (error) {
        console.error("Login Error:", error);
        errorMsg.classList.remove("d-none");

        let pesan = "Email atau Password salah.";
        if (error.code === "auth/user-not-found") pesan = "Akun tidak terdaftar.";
        if (error.code === "auth/wrong-password") pesan = "Password salah.";
        if (error.code === "auth/invalid-credential") pesan = "Email atau Password salah.";
        if (error.message === "pending_approval") pesan = "Akun Anda sedang menunggu persetujuan Administrator.";
        if (error.message === "account_inactive") pesan = "Akun Anda telah dinonaktifkan. Silakan hubungi Administrator.";
        if (error.code === "permission-denied") pesan = "Login berhasil, tetapi akun ini belum punya izin akses. Hubungi admin untuk diberikan akses.";

        errorMsg.innerText = pesan;
        submitBtn.disabled = false;
        submitBtn.innerHTML = "Masuk";
      }
    });

    // --- PROSES FORGOT PASSWORD ---
    const forgotForm = document.getElementById("forgotPasswordForm");
    const forgotSubmitBtn = document.getElementById("forgotSubmitBtn");
    const forgotErrorMsg = document.getElementById("forgotErrorMessage");
    const forgotSuccessMsg = document.getElementById("forgotSuccessMessage");

    forgotForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      forgotSubmitBtn.disabled = true;
      forgotSubmitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Mengirim...';
      forgotErrorMsg.classList.add("d-none");
      forgotSuccessMsg.classList.add("d-none");

      const email = document.getElementById("forgotEmail").value.trim();

      try {
        await sendPasswordResetEmail(auth, email);
        forgotSuccessMsg.innerText = "Tautan reset password telah dikirim. Silakan cek kotak masuk atau folder spam.";
        forgotSuccessMsg.classList.remove("d-none");
        forgotForm.reset();
      } catch (error) {
        forgotErrorMsg.classList.remove("d-none");
        let pesan = "Terjadi kesalahan saat mengirim tautan reset.";
        if (error.code === "auth/user-not-found") pesan = "Email tidak terdaftar.";
        if (error.code === "auth/invalid-email") pesan = "Format email tidak valid.";
        forgotErrorMsg.innerText = pesan;
      } finally {
        forgotSubmitBtn.disabled = false;
        forgotSubmitBtn.innerHTML = "Kirim Link Reset";
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
