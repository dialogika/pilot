<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="assets/img/favicon.webp" />
    <title>Login - Team Dialogika</title>

    <!-- Login migrated to pages/login/ (public route /login).
         This root entry point is kept only as a redirect stub because
         Firebase Hosting serves index.html statically for "/" and cannot
         be overridden by a Hosting rewrite.
         Legacy monolithic login page: see git history (before commit
         "refactor(login): migrate legacy index.html ..."). -->
    <link rel="canonical" href="/login" />
    <meta http-equiv="refresh" content="0;url=/login" />
    <script>
      // replace() keeps this stub out of the back-button history.
      location.replace("/login");
    </script>
  </head>
  <body>
    <p>Mengalihkan ke halaman login&hellip; <a href="/login">Klik di sini</a> jika tidak teralihkan otomatis.</p>
  </body>
</html>
