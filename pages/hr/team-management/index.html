<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/webp" href="/assets/img/favicon.webp" />
    <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.webp" />
    <title>Team Management — Dialogika</title>

    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <!-- Bootstrap 5.3 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Tailwind CSS (CDN for utility compatibility) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Shared Foundation Styles -->
    <link rel="stylesheet" href="/assets/css/theme.css" />
    <link rel="stylesheet" href="/assets/css/layout.css" />

    <!-- Scoped Feature Styles -->
    <link
      rel="stylesheet"
      href="/pages/hr/team-management/team-management.css"
    />

    <!-- Shared theme manager -->
    <script src="/assets/js/theme.js" defer></script>
    <style>
      body {
        font-family: "Poppins", sans-serif;
      }
    </style>
  </head>

  <body class="antialiased bg-slate-50 text-slate-800">
    <!-- Shell Mount Points -->
    <div id="dg-topbar-mount"></div>
    <div id="dg-sidebar-mount"></div>

    <!-- Main Content Area -->
    <main class="dg-main">
      <div class="w-full">
        <!-- Page Header -->
        <div class="mb-5">
          <!-- Breadcrumb -->
          <nav class="flex items-center gap-2 text-[11px] font-bold uppercase tracking-wider mb-1.5">
            <a href="/home" class="text-blue-600 hover:text-blue-700 transition" title="Home">
              <i class="fas fa-home text-xs"></i>
            </a>
            <span class="text-blue-600">/</span>
            <span class="text-blue-600">HR DIVISION</span>
            <span class="text-slate-400">/</span>
            <span class="text-slate-400">TEAM MANAGEMENT</span>
          </nav>
          <h1 class="page-title mb-1">Team Management</h1>
          <p class="text-slate-500 text-xs mb-0">
            Overview of team members and division structure
          </p>
        </div>

        <!-- Dynamic Division Cards Container -->
        <div class="d-grid gap-4" id="teamDivisionContainer"></div>
      </div>
    </main>

    <!-- Member Modal (Add / Edit) -->
    <div
      class="modal fade"
      id="teamMemberModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="teamMemberModalTitle">Tambah Anggota</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <form id="teamMemberForm">
            <input type="hidden" id="teamMemberId" />
            <div class="modal-body">
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="teamMemberName" class="form-label small fw-bold"
                    >Nama</label
                  >
                  <input
                    type="text"
                    id="teamMemberName"
                    class="form-control form-control-custom"
                    required
                  />
                </div>
                <div class="col-md-6">
                  <label
                    for="teamMemberWhatsapp"
                    class="form-label small fw-bold"
                    >Nomor WhatsApp</label
                  >
                  <input
                    type="text"
                    id="teamMemberWhatsapp"
                    class="form-control form-control-custom"
                  />
                </div>
                <div class="col-md-6">
                  <label for="teamMemberEmail" class="form-label small fw-bold"
                    >Email</label
                  >
                  <input
                    type="email"
                    id="teamMemberEmail"
                    class="form-control form-control-custom"
                  />
                </div>
                <div class="col-md-6">
                  <label
                    for="teamMemberInstagram"
                    class="form-label small fw-bold"
                    >Instagram</label
                  >
                  <input
                    type="text"
                    id="teamMemberInstagram"
                    class="form-control form-control-custom"
                  />
                </div>
                <div class="col-md-6">
                  <label
                    for="teamMemberLinkedin"
                    class="form-label small fw-bold"
                    >LinkedIn</label
                  >
                  <input
                    type="text"
                    id="teamMemberLinkedin"
                    class="form-control form-control-custom"
                  />
                </div>
                <div class="col-md-6">
                  <label
                    for="teamMemberAddress"
                    class="form-label small fw-bold"
                    >Address</label
                  >
                  <input
                    type="text"
                    id="teamMemberAddress"
                    class="form-control form-control-custom"
                  />
                </div>
                <div class="col-md-6">
                  <label
                    for="teamMemberBirthDate"
                    class="form-label small fw-bold"
                    >Birth Date</label
                  >
                  <input
                    type="date"
                    id="teamMemberBirthDate"
                    class="form-control form-control-custom"
                  />
                </div>
                <div class="col-md-6">
                  <label for="teamMemberStatus" class="form-label small fw-bold"
                    >Status</label
                  >
                  <select
                    id="teamMemberStatus"
                    class="form-select form-select-custom"
                    required
                  >
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                    <option value="On Leave">On Leave</option>
                    <option value="Ghosted">Ghosted</option>
                    <option value="Resigned">Resigned</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label
                    for="teamMemberContractType"
                    class="form-label small fw-bold"
                    >Jenis Kontrak</label
                  >
                  <select
                    id="teamMemberContractType"
                    class="form-select form-select-custom"
                  >
                    <option value="PKWT">PKWT</option>
                    <option value="PKWTT">PKWTT</option>
                    <option value="Freelance">Freelance</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label
                    for="teamMemberStartDate"
                    class="form-label small fw-bold"
                    >Start Date</label
                  >
                  <input
                    type="date"
                    id="teamMemberStartDate"
                    class="form-control form-control-custom"
                  />
                </div>
                <div class="col-md-6">
                  <label
                    for="teamMemberEndDate"
                    class="form-label small fw-bold"
                    >End Date</label
                  >
                  <input
                    type="date"
                    id="teamMemberEndDate"
                    class="form-control form-control-custom"
                  />
                </div>
                <div class="col-md-6">
                  <label for="teamMemberBank" class="form-label small fw-bold"
                    >Bank / Wallet</label
                  >
                  <input
                    type="text"
                    id="teamMemberBank"
                    class="form-control form-control-custom"
                  />
                </div>
                <div class="col-md-6">
                  <label
                    for="teamMemberAccountNumber"
                    class="form-label small fw-bold"
                    >Nomor Rekening</label
                  >
                  <input
                    type="text"
                    id="teamMemberAccountNumber"
                    class="form-control form-control-custom"
                  />
                </div>
                <div class="col-md-6">
                  <label for="teamMemberFee" class="form-label small fw-bold"
                    >Price / Fee</label
                  >
                  <input
                    type="number"
                    id="teamMemberFee"
                    class="form-control form-control-custom"
                    min="0"
                    step="any"
                  />
                </div>
                <div class="col-md-12">
                  <label
                    for="teamMemberPkwtFile"
                    class="form-label small fw-bold"
                    >PKWT Contract File</label
                  >
                  <input
                    type="file"
                    id="teamMemberPkwtFile"
                    class="form-control form-control-custom"
                    accept=".pdf,.doc,.docx"
                  />
                  <small class="text-muted d-block mt-1"
                    >Format: PDF, DOC, DOCX</small
                  >
                  <div id="pkwtFileStatus" class="mt-2"></div>
                </div>
                <div class="col-md-12">
                  <label class="form-label small fw-bold">Dokumen Tim</label>
                  <div class="border rounded-3 p-3 bg-light">
                    <div
                      class="d-flex flex-column flex-md-row justify-content-between gap-3 align-items-md-center"
                    >
                      <div>
                        <div class="fw-bold text-dark text-sm">
                          Upload dokumen anggota
                        </div>
                        <small class="text-muted"
                          >Format: PDF, DOC, DOCX, JPG, JPEG, PNG. File bisa
                          ditambahkan beberapa kali sebelum disimpan.</small
                        >
                      </div>
                      <div>
                        <input
                          type="file"
                          id="teamMemberDocuments"
                          class="d-none"
                          accept=".pdf,.doc,.docx,.jpg,.jpeg,.png"
                          multiple
                        />
                        <button
                          type="button"
                          class="btn btn-sm btn-light border fw-bold"
                          id="teamMemberDocumentsChooseBtn"
                        >
                          <i class="fas fa-paperclip me-2"></i>Pilih File
                        </button>
                      </div>
                    </div>
                    <div id="teamExistingDocumentsList" class="mt-3"></div>
                    <div
                      id="teamMemberDocumentsStatus"
                      class="mt-3"
                      style="max-height: 180px; overflow-y: auto"
                    >
                      <ul
                        id="teamMemberDocumentsList"
                        class="list-unstyled mb-0"
                        style="font-size: 0.85rem"
                      ></ul>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-light border"
                data-bs-dismiss="modal"
              >
                Batal
              </button>
              <button
                type="submit"
                class="btn btn-primary-custom"
                id="teamMemberSubmitBtn"
              >
                Simpan Anggota
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- View Documents Modal -->
    <div
      class="modal fade"
      id="teamDocumentsViewModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">
              Dokumen Tim: <span id="documentsMemberName"></span>
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div id="documentsListContainer">
              <div class="alert alert-info mb-0">
                <i class="fas fa-info-circle me-2"></i>Tidak ada dokumen
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Orchestrator Script Entry Point -->
    <script
      type="module"
      src="/pages/hr/team-management/team-management.js"
    ></script>
  </body>
</html>
