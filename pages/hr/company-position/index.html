<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/webp" href="/assets/img/favicon.webp" />
    <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.webp" />
    <title>Company Position — Dialogika</title>

    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Tailwind CSS (CDN for utilities) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Shared Foundation Styles -->
    <link rel="stylesheet" href="/assets/css/theme.css" />
    <link rel="stylesheet" href="/assets/css/layout.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />

    <!-- Scoped Feature Styles -->
    <link href="/pages/hr/company-position/company-position.css" rel="stylesheet" />

    <!-- Lucide Icons (for quick-menu rightbar) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Shared theme manager -->
    <script src="/assets/js/theme.js" defer></script>
    <style>
      body {
        font-family: 'Poppins', sans-serif;
      }
    </style>
  </head>

  <body class="antialiased">
    <!-- Shell Mount Points -->
    <div id="dg-topbar-mount"></div>
    <div id="dg-sidebar-mount"></div>

    <!-- Main Content Area -->
    <main class="dg-main">
      <div class="w-full">
        <!-- Page Header -->
        <div
          class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3"
        >
          <div>
            <!-- Breadcrumb -->
            <nav class="flex items-center gap-2 text-[11px] font-bold uppercase tracking-wider mb-1.5">
              <a href="/home" class="text-blue-600 hover:text-blue-700 transition" title="Home">
                <i class="fas fa-home text-xs"></i>
              </a>
              <span class="text-blue-600">/</span>
              <span class="text-blue-600">HR DIVISION</span>
              <span class="text-slate-400">/</span>
              <span class="text-slate-400">COMPANY POSITION</span>
            </nav>
            <h1 class="page-title mb-1">Company Position</h1>
            <p class="text-slate-500 text-xs mb-0">
              Overview of active recruitment and head counts
            </p>
          </div>

          <div class="d-flex align-items-center gap-2 flex-wrap">
            <!-- Grid / List Toggle -->
            <div class="view-toggle-group d-flex" role="group" aria-label="View toggle">
              <button
                type="button"
                id="viewGridBtn"
                class="view-toggle-btn active"
                title="Grid View"
              >
                <i class="fas fa-th-large"></i>
              </button>
              <button
                type="button"
                id="viewListBtn"
                class="view-toggle-btn"
                title="List View"
              >
                <i class="fas fa-list"></i>
              </button>
            </div>

            <!-- Export Button -->
            <button
              type="button"
              class="btn btn-white border bg-white shadow-sm rounded-xl px-3 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-50"
            >
              <i class="fas fa-file-export me-1.5 text-slate-400"></i> Export
            </button>

            <!-- Add Position Button -->
            <button
              id="positionAddBtn"
              type="button"
              class="btn btn-dlg-blue rounded-xl px-3.5 py-2 text-xs font-bold shadow-sm"
            >
              + Add Position
            </button>
          </div>
        </div>

        <!-- Filter Panel -->
        <div class="filter-panel">
          <div class="row g-3 align-items-center">
            <div class="col-lg-4 col-md-5">
              <div class="input-group border-0 bg-slate-50 rounded-xl px-2">
                <span class="input-group-text bg-transparent border-0 text-slate-400">
                  <i class="fas fa-search text-xs"></i>
                </span>
                <input
                  type="text"
                  id="positionSearchInput"
                  class="form-control bg-transparent border-0 py-2 shadow-none text-xs"
                  placeholder="Search position..."
                />
              </div>
            </div>

            <div class="col-lg-8 col-md-7 d-flex flex-column align-items-md-end gap-2">
              <div class="d-flex justify-content-md-end gap-2 flex-wrap w-full">
                <!-- Department Filter -->
                <select
                  id="positionDeptFilter"
                  class="form-select border-0 bg-slate-50 rounded-xl w-auto shadow-none py-2 px-3 font-semibold text-xs text-slate-700"
                >
                  <option value="All">All Department</option>
                </select>

                <!-- Status Filter -->
                <select
                  id="positionStatusFilter"
                  class="form-select border-0 bg-slate-50 rounded-xl w-auto shadow-none py-2 px-3 font-semibold text-xs text-slate-700"
                >
                  <option value="All">All Status</option>
                  <option value="Open">Open</option>
                  <option value="Close">Close</option>
                </select>

                <!-- Date Preset Filter -->
                <select
                  id="positionDateFilter"
                  class="form-select border-0 bg-slate-50 rounded-xl w-auto shadow-none py-2 px-3 font-semibold text-xs text-slate-700"
                >
                  <option value="all">All Time</option>
                  <option value="last7">Last 7 days</option>
                  <option value="last30">Last month</option>
                  <option value="last90">Last 3 months</option>
                  <option value="custom">Custom range</option>
                </select>
              </div>

              <!-- Custom Date Range -->
              <div
                id="positionDateRangeWrapper"
                class="d-none d-flex justify-content-md-end gap-2 flex-wrap"
              >
                <input
                  type="date"
                  id="positionDateStart"
                  class="form-control form-control-sm w-auto rounded-lg text-xs"
                />
                <input
                  type="date"
                  id="positionDateEnd"
                  class="form-control form-control-sm w-auto rounded-lg text-xs"
                />
              </div>
            </div>
          </div>
        </div>

        <!-- Grid View Container -->
        <div id="positionsGridWrapper">
          <div class="row g-4" id="positionsGrid">
            <div class="col-12 text-center py-5 text-slate-400">
              <i class="fas fa-briefcase text-4xl mb-3 block animate-pulse"></i>
              <p class="text-sm font-medium">Loading positions...</p>
            </div>
          </div>
        </div>

        <!-- List View Container (Table) -->
        <div id="positionsListWrapper" class="d-none">
          <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="overflow-x-auto">
              <table class="min-w-full text-left align-middle mb-0">
                <thead class="bg-slate-50 text-slate-600 text-xs font-semibold border-b border-slate-100">
                  <tr>
                    <th scope="col" class="px-4 py-3">Position</th>
                    <th scope="col" class="px-3 py-3 text-center">Count</th>
                    <th scope="col" class="px-4 py-3">Job Description</th>
                    <th scope="col" class="px-3 py-3 text-center">Status</th>
                    <th scope="col" class="px-3 py-3 text-center">Active</th>
                    <th scope="col" class="px-3 py-3 text-center">Applicant</th>
                    <th scope="col" class="px-4 py-3">Department</th>
                    <th scope="col" class="px-4 py-3 text-end">Action</th>
                  </tr>
                </thead>
                <tbody id="positionsTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Load More / Explore Positions Button -->
        <div class="text-center mt-5 mb-4">
          <button id="positionsLoadMoreBtn" class="btn btn-load">
            Explore More Positions
          </button>
        </div>
      </div>
    </main>

    <!-- Modal: Add Position -->
    <div
      class="modal fade"
      id="positionAddModal"
      tabindex="-1"
      aria-labelledby="positionAddModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-2xl shadow-xl overflow-hidden">
          <div class="modal-header border-b border-slate-100 px-5 py-4">
            <h5 class="modal-title font-bold text-slate-800 text-base" id="positionAddModalLabel">
              Add Position
            </h5>
            <button
              type="button"
              class="btn-close text-xs"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body p-5">
            <form id="positionAddForm">
              <div class="mb-3">
                <label for="positionAddName" class="form-label font-semibold text-xs text-slate-700">
                  Nama Posisi
                </label>
                <input
                  type="text"
                  class="form-control rounded-xl text-xs py-2 border-slate-200"
                  id="positionAddName"
                  placeholder="e.g. Recruitment Specialist"
                  required
                />
              </div>

              <div class="mb-3">
                <label
                  for="positionAddDepartment"
                  class="form-label font-semibold text-xs text-slate-700"
                >
                  Department
                </label>
                <select
                  class="form-select rounded-xl text-xs py-2 border-slate-200"
                  id="positionAddDepartment"
                  required
                ></select>
              </div>

              <div class="row g-2 mb-3">
                <div class="col-4">
                  <label
                    for="positionAddHeadCount"
                    class="form-label font-semibold text-[11px] text-slate-700"
                  >
                    Head Count
                  </label>
                  <input
                    type="number"
                    min="0"
                    class="form-control rounded-xl text-xs py-2 border-slate-200"
                    id="positionAddHeadCount"
                    value="0"
                  />
                </div>
                <div class="col-4">
                  <label
                    for="positionAddActive"
                    class="form-label font-semibold text-[11px] text-slate-700"
                  >
                    Active Person
                  </label>
                  <input
                    type="number"
                    min="0"
                    class="form-control rounded-xl text-xs py-2 border-slate-200"
                    id="positionAddActive"
                    value="0"
                  />
                </div>
                <div class="col-4">
                  <label
                    for="positionAddApplicant"
                    class="form-label font-semibold text-[11px] text-slate-700"
                  >
                    Job Applicant
                  </label>
                  <input
                    type="number"
                    min="0"
                    class="form-control rounded-xl text-xs py-2 border-slate-200"
                    id="positionAddApplicant"
                    value="0"
                  />
                </div>
              </div>

              <div class="mb-3">
                <label
                  for="positionAddJobdesk"
                  class="form-label font-semibold text-xs text-slate-700"
                >
                  Job Description
                </label>
                <textarea
                  class="form-control rounded-xl text-xs py-2 border-slate-200"
                  id="positionAddJobdesk"
                  rows="4"
                  placeholder="Enter job description..."
                ></textarea>
              </div>

              <div class="mb-3">
                <label
                  for="positionAddStatus"
                  class="form-label font-semibold text-xs text-slate-700"
                >
                  Status
                </label>
                <select
                  class="form-select rounded-xl text-xs py-2 border-slate-200"
                  id="positionAddStatus"
                >
                  <option value="Open">Open</option>
                  <option value="Close">Close</option>
                </select>
              </div>
            </form>
          </div>
          <div class="modal-footer border-t border-slate-100 px-5 py-3 gap-2">
            <button
              type="button"
              class="btn btn-light border rounded-xl text-xs font-semibold px-4 py-2"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              type="submit"
              form="positionAddForm"
              class="btn btn-dlg-blue rounded-xl text-xs font-bold px-4 py-2"
            >
              Save
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal: Edit Position -->
    <div
      class="modal fade"
      id="positionEditModal"
      tabindex="-1"
      aria-labelledby="positionEditModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-2xl shadow-xl overflow-hidden">
          <div class="modal-header border-b border-slate-100 px-5 py-4">
            <h5 class="modal-title font-bold text-slate-800 text-base" id="positionEditModalLabel">
              Edit Position
            </h5>
            <button
              type="button"
              class="btn-close text-xs"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body p-5">
            <form id="positionEditForm">
              <input type="hidden" id="positionEditId" />

              <div class="mb-3">
                <label for="positionEditName" class="form-label font-semibold text-xs text-slate-700">
                  Nama Posisi
                </label>
                <input
                  type="text"
                  class="form-control rounded-xl text-xs py-2 border-slate-200"
                  id="positionEditName"
                  required
                />
              </div>

              <div class="mb-3">
                <label
                  for="positionEditDepartment"
                  class="form-label font-semibold text-xs text-slate-700"
                >
                  Department
                </label>
                <select
                  class="form-select rounded-xl text-xs py-2 border-slate-200"
                  id="positionEditDepartment"
                  required
                ></select>
              </div>

              <div class="row g-2 mb-3">
                <div class="col-4">
                  <label
                    for="positionEditHeadCount"
                    class="form-label font-semibold text-[11px] text-slate-700"
                  >
                    Head Count
                  </label>
                  <input
                    type="number"
                    min="0"
                    class="form-control rounded-xl text-xs py-2 border-slate-200"
                    id="positionEditHeadCount"
                  />
                </div>
                <div class="col-4">
                  <label
                    for="positionEditActive"
                    class="form-label font-semibold text-[11px] text-slate-700"
                  >
                    Active Person
                  </label>
                  <input
                    type="number"
                    min="0"
                    class="form-control rounded-xl text-xs py-2 border-slate-200"
                    id="positionEditActive"
                  />
                </div>
                <div class="col-4">
                  <label
                    for="positionEditApplicant"
                    class="form-label font-semibold text-[11px] text-slate-700"
                  >
                    Job Applicant
                  </label>
                  <input
                    type="number"
                    min="0"
                    class="form-control rounded-xl text-xs py-2 border-slate-200"
                    id="positionEditApplicant"
                  />
                </div>
              </div>

              <div class="mb-3">
                <label
                  for="positionEditJobdesk"
                  class="form-label font-semibold text-xs text-slate-700"
                >
                  Job Description
                </label>
                <textarea
                  class="form-control rounded-xl text-xs py-2 border-slate-200"
                  id="positionEditJobdesk"
                  rows="4"
                  placeholder="Enter job description..."
                ></textarea>
              </div>

              <div class="mb-3">
                <label
                  for="positionEditStatus"
                  class="form-label font-semibold text-xs text-slate-700"
                >
                  Status
                </label>
                <select
                  class="form-select rounded-xl text-xs py-2 border-slate-200"
                  id="positionEditStatus"
                >
                  <option value="Open">Open</option>
                  <option value="Close">Close</option>
                </select>
              </div>
            </form>
          </div>
          <div class="modal-footer border-t border-slate-100 px-5 py-3 gap-2">
            <button
              type="button"
              class="btn btn-light border rounded-xl text-xs font-semibold px-4 py-2"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              type="submit"
              form="positionEditForm"
              class="btn btn-dlg-blue rounded-xl text-xs font-bold px-4 py-2"
            >
              Save
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Orchestrator Script Entry Point -->
    <script type="module" src="/pages/hr/company-position/company-position.js"></script>
  </body>
</html>
