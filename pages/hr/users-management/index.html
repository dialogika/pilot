<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/assets/img/favicon.webp" />
    <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Users Management - Team Dialogika</title>

    <!-- Bootstrap 5.3 + Icons + Fonts (matches legacy & migrated pages) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- New architecture foundation -->
    <link href="/assets/css/theme.css" rel="stylesheet" />
    <link href="/assets/css/layout.css" rel="stylesheet" />
    <!-- Users Management feature styles (feature-only) -->
    <link href="/pages/hr/users-management/users-management.css" rel="stylesheet" />

    <!-- Shared theme manager -->
    <script src="/assets/js/theme.js" defer></script>

    <!-- Centralized Auth Guard (also imported as module in JS; kept for parity) -->
    <script type="module" src="/assets/js/auth-guard.js"></script>
    <style>
      body { font-family: 'Poppins', sans-serif; }
    </style>
  </head>
  <body class="antialiased">
    <!-- Shared shell mounts (renderTopbar / renderSidebar) -->
    <div id="dg-topbar-mount"></div>
    <div id="dg-sidebar-mount"></div>

    <main class="dg-main">
      <div class="max-w-[1400px] mx-auto px-6 py-6">
        <!-- Header Section (legacy visual preserved) -->
        <div class="flex justify-between items-center mb-6">
          <div>
            <h1 class="text-2xl font-bold text-slate-800">Users Management</h1>
            <nav class="text-sm text-slate-500 flex items-center gap-2 mt-1">
              <a href="/home"><i class="fas fa-home text-xs"></i></a>
              <span>/ Settings /</span>
              <span class="font-medium text-slate-800">Users</span>
            </nav>
          </div>
          <div class="flex gap-3">
            <div class="relative" id="exportDropdownWrapper">
              <button
                id="exportButton"
                class="flex items-center gap-2 bg-white border border-slate-200 px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-50 transition"
              >
                <i class="fas fa-file-export text-slate-400"></i> Export
                <i class="fas fa-chevron-down text-[10px]"></i>
              </button>
              <div
                id="exportMenu"
                class="absolute right-0 mt-2 w-40 bg-white border border-slate-200 rounded-lg shadow-lg text-sm text-slate-700 hidden z-20"
              >
                <button class="w-full text-left px-4 py-2 hover:bg-slate-50">Export to PDF</button>
                <button class="w-full text-left px-4 py-2 hover:bg-slate-50">Export to Excel</button>
              </div>
            </div>
            <button
              id="um-add-user-btn"
              class="flex items-center gap-2 btn-dlg-green text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm"
            >
              <i class="fas fa-plus"></i> Add User
            </button>
          </div>
        </div>

        <!-- Table Container (legacy: bg-white rounded-xl shadow-sm border) -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
          <!-- Filter Bar (legacy) -->
          <div class="p-5 border-b border-slate-100">
            <div class="flex flex-wrap justify-between items-center gap-4">
              <h2 class="font-bold text-slate-800">Users List</h2>
              <div class="flex gap-3 flex-wrap">
                <div class="relative">
                  <select
                    id="filterDatePreset"
                    class="appearance-none bg-white border border-slate-200 pl-4 pr-10 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                  >
                    <option value="last90">Last 90 Days</option>
                    <option value="last30">Last 30 Days</option>
                    <option value="last60">Last 60 Days</option>
                    <option value="last6month">Last 6 Month</option>
                    <option value="thisYear">This Year</option>
                    <option value="lastYear">Last Year</option>
                    <option value="custom">Custom Range</option>
                  </select>
                  <i class="fas fa-chevron-down absolute right-3 top-3 text-[10px] text-slate-400 pointer-events-none"></i>
                </div>
                <div class="relative">
                  <select
                    id="um-filter-role"
                    class="appearance-none bg-white border border-slate-200 pl-4 pr-10 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                  >
                    <option value="">All Role</option>
                  </select>
                  <i class="fas fa-chevron-down absolute right-3 top-3 text-[10px] text-slate-400 pointer-events-none"></i>
                </div>
                <div class="relative">
                  <select
                    id="filterStatus"
                    class="appearance-none bg-white border border-slate-200 pl-4 pr-10 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                  >
                    <option value="">All Status</option>
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                  </select>
                  <i class="fas fa-chevron-down absolute right-3 top-3 text-[10px] text-slate-400 pointer-events-none"></i>
                </div>
                <div class="relative">
                  <select
                    id="filterSort"
                    class="appearance-none bg-white border border-slate-200 pl-4 pr-10 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                  >
                    <option value="recent">Recently Add</option>
                    <option value="nameAsc">Name Ascending</option>
                    <option value="nameDesc">Name Descending</option>
                  </select>
                  <i class="fas fa-chevron-down absolute right-3 top-3 text-[10px] text-slate-400 pointer-events-none"></i>
                </div>
              </div>
            </div>
          </div>

          <!-- Search & Row Per Page (legacy) -->
          <div class="p-5 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-2 text-sm text-slate-600">
              Row Per Page
              <select
                id="um-rows-per-page"
                class="bg-white border border-slate-200 px-2 py-1 rounded-md focus:outline-none text-sm"
              >
                <option value="5">5</option>
                <option value="10" selected>10</option>
                <option value="25">25</option>
                <option value="50">50</option>
              </select>
              Entries
            </div>
            <div class="relative w-full sm:w-auto">
              <input
                id="um-search"
                type="text"
                placeholder="Search"
                class="border border-slate-200 pl-4 pr-10 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 w-full sm:w-64"
              />
              <i class="fas fa-search absolute right-3 top-3 text-slate-400 text-sm pointer-events-none"></i>
            </div>
          </div>

          <!-- Table (legacy) -->
          <div class="overflow-x-auto">
            <table class="min-w-full text-left">
              <thead class="bg-slate-50 text-slate-600 text-sm font-semibold border-y border-slate-100">
                <tr>
                  <th class="px-6 py-4 w-10 sticky left-0 bg-slate-50 z-20">
                    <input id="selectAllCheckbox" type="checkbox" class="rounded text-orange-500" />
                  </th>
                  <th class="px-6 py-4 cursor-pointer select-none sticky left-10 bg-slate-50 z-10">
                    <span class="inline-flex items-center gap-2 whitespace-nowrap">Name <i class="fas fa-sort text-slate-300"></i></span>
                  </th>
                  <th class="px-6 py-4 cursor-pointer select-none">
                    <span class="inline-flex items-center gap-2 whitespace-nowrap">Email <i class="fas fa-sort text-slate-300"></i></span>
                  </th>
                  <th class="px-6 py-4 text-center cursor-pointer select-none">
                    <span class="inline-flex items-center gap-2 whitespace-nowrap">Position <i class="fas fa-sort text-slate-300"></i></span>
                  </th>
                  <th class="px-6 py-4 text-center cursor-pointer select-none">
                    <span class="inline-flex items-center gap-2 whitespace-nowrap">Role <i class="fas fa-sort text-slate-300"></i></span>
                  </th>
                  <th class="px-6 py-4 text-center cursor-pointer select-none">
                    <span class="inline-flex items-center gap-2 whitespace-nowrap">Status <i class="fas fa-sort text-slate-300"></i></span>
                  </th>
                  <th class="px-6 py-4 text-right">Action</th>
                </tr>
              </thead>
              <tbody id="um-tbody" class="text-sm divide-y divide-slate-100"></tbody>
            </table>
          </div>

          <!-- Pagination Footer (legacy) -->
          <div id="um-pagination" class="p-5 border-t border-slate-100 flex flex-col sm:flex-row justify-between items-center text-sm gap-3"></div>
        </div>
      </div>
    </main>

    <!-- Custom Range Overlay (legacy, hidden) -->
    <div id="customRangeOverlay" class="fixed inset-0 bg-black/40 flex items-center justify-center z-30 hidden">
      <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 mx-4">
        <div class="mb-4">
          <h3 class="text-lg font-semibold text-slate-800">Custom Range</h3>
          <p class="text-xs text-slate-500 mt-1">Pilih tanggal mulai dan tanggal akhir</p>
        </div>
        <div class="grid grid-cols-2 gap-4 mb-6">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Start Date</label>
            <input id="customStartDate" type="date" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">End Date</label>
            <input id="customEndDate" type="date" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
          </div>
        </div>
        <div class="flex justify-end gap-2">
          <button id="customRangeCancel" class="px-4 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-100">Cancel</button>
          <button id="customRangeApply" class="px-4 py-2 rounded-lg text-sm bg-[#F26522] text-white hover:bg-orange-600">Apply</button>
        </div>
      </div>
    </div>

    <!-- Add / Edit User Modal (legacy: fixed inset-0 bg-black/40, bg-white rounded-2xl) -->
    <div id="add-edit-modal" class="fixed inset-0 bg-black/40 flex items-center justify-center z-40 hidden p-4">
      <div class="bg-white rounded-2xl shadow-xl w-full max-w-3xl p-6 max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between mb-4">
          <h3 id="modal-title" class="text-xl font-semibold text-slate-800">Add User</h3>
          <button type="button" class="um-modal-close text-slate-400 hover:text-slate-600" data-close="add-edit-modal">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div>
            <label for="um-fullname" class="block text-xs font-medium text-slate-600 mb-1">Full Name</label>
            <input id="um-fullname" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" required />
          </div>
          <div>
            <label for="um-position" class="block text-xs font-medium text-slate-600 mb-1">Position</label>
            <select id="um-position" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500">
              <option value="">— Select Position —</option>
            </select>
          </div>
          <div id="field-display-name">
            <label for="um-display-name" class="block text-xs font-medium text-slate-600 mb-1">Display Name</label>
            <input id="um-display-name" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
          </div>
          <div>
            <label for="um-email" class="block text-xs font-medium text-slate-600 mb-1">Email</label>
            <input id="um-email" type="email" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
          </div>
          <div id="field-password">
            <label for="um-password" class="block text-xs font-medium text-slate-600 mb-1">Password</label>
            <div class="relative">
              <input id="um-password" type="password" class="w-full border border-slate-200 rounded-lg px-3 py-2 pr-10 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
              <button type="button" class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600" onclick="document.getElementById('um-password').type = document.getElementById('um-password').type === 'password' ? 'text' : 'password'">
                <i class="fas fa-eye-slash"></i>
              </button>
            </div>
          </div>
          <div>
            <label for="um-status" class="block text-xs font-medium text-slate-600 mb-1">Status</label>
            <select id="um-status" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500">
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>
          </div>
          <div>
            <label for="um-phone" class="block text-xs font-medium text-slate-600 mb-1">Phone</label>
            <input id="um-phone" type="text" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
          </div>
          <div>
            <label for="um-role" class="block text-xs font-medium text-slate-600 mb-1">Role</label>
            <select id="um-role" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500">
              <option value="staff">Staff</option>
            </select>
          </div>
          <div class="md:col-span-2">
            <label for="um-department" class="block text-xs font-medium text-slate-600 mb-1">Department</label>
            <input id="um-department" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
          </div>
        </div>
        <div class="flex justify-end gap-2 mt-4">
          <button type="button" class="px-4 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-100 um-modal-close" data-close="add-edit-modal">Cancel</button>
          <button id="um-submit-btn" type="button" class="px-4 py-2 rounded-lg btn-dlg-green text-white text-sm">Save</button>
        </div>
      </div>
    </div>

    <!-- Delete Confirmation Modal (legacy) -->
    <div id="delete-confirm-modal" class="fixed inset-0 bg-black/40 flex items-center justify-center z-40 hidden p-4">
      <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 text-center mx-4">
        <div class="mx-auto mb-4 w-14 h-14 rounded-xl bg-red-50 flex items-center justify-center">
          <i class="fas fa-trash text-red-500 text-2xl"></i>
        </div>
        <h3 class="text-lg font-semibold text-slate-800 mb-1">Confirm Delete</h3>
        <p class="text-sm text-slate-600 mb-2">You want to delete all the marked items, this cant be undone once you delete.</p>
        <p id="delete-user-label" class="text-sm font-semibold text-slate-800 mb-6"></p>
        <div class="flex justify-center gap-3">
          <button type="button" class="px-4 py-2 rounded-lg text-sm text-slate-600 border border-slate-200 hover:bg-slate-50 um-modal-close" data-close="delete-confirm-modal">Cancel</button>
          <button id="um-confirm-delete-btn" type="button" class="px-4 py-2 rounded-lg text-sm bg-red-500 text-white hover:bg-red-600">Yes, Delete</button>
        </div>
      </div>
    </div>

    <!-- SweetAlert2 + Bootstrap JS (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Users Management orchestrator -->
    <script type="module" src="/pages/hr/users-management/users-management.js"></script>
  </body>
</html>
