<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/webp" href="/assets/img/favicon.webp" />
    <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.webp" />
    <title>Exit Interview - Team Dialogika</title>

    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <!-- Bootstrap 5.3 CSS & SweetAlert2 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
    />

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Shared Foundation Styles -->
    <link rel="stylesheet" href="/assets/css/theme.css" />
    <link rel="stylesheet" href="/assets/css/layout.css" />

    <!-- Scoped Feature Styles -->
    <link rel="stylesheet" href="/pages/hr/exit-interview/exit-interview.css" />

    <!-- Shared theme manager -->
    <script src="/assets/js/theme.js" defer></script>

    <!-- Centralized Auth Guard -->
    <script type="module" src="/assets/js/auth-guard.js"></script>

    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: #f1f7fd;
        color: var(--text-strong, #0f172a);
      }
    </style>
  </head>

  <body class="antialiased">
    <!-- Shared Shell Mount Points -->
    <div id="dg-topbar-mount"></div>
    <div id="dg-sidebar-mount"></div>

    <!-- Main Content Area -->
    <main class="dg-main">
      <div class="w-full max-w-[1700px] mx-auto px-4 sm:px-6 lg:px-12 py-6">
        <!-- Header with Breadcrumbs (Consistent HR Division Standard) -->
        <header
          class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-6"
        >
          <div>
            <nav
              class="flex items-center gap-2 text-xs font-bold text-blue-600 uppercase tracking-widest mb-2"
              aria-label="Breadcrumb"
            >
              <a
                href="/home"
                class="text-blue-600 hover:text-blue-700 transition"
                title="Home"
              >
                <span><i class="bi bi-house-fill"></i></span>
              </a>
              <span class="text-blue-600">/</span>
              <span class="text-blue-600">HR DIVISION</span>
              <span class="text-blue-600">/</span>
              <span class="text-slate-400">EXIT INTERVIEW</span>
            </nav>
            <h1
              class="text-3xl md:text-4xl font-extrabold text-slate-900 tracking-tight"
            >
              Exit Interview
            </h1>
          </div>
        </header>

        <!-- Action Button -->
        <div class="mb-6">
          <button id="btnCreateExitInterview" class="exit-add-btn">
            <i class="bi bi-plus-lg"></i>
            <span>Buat Exit Interview</span>
          </button>
        </div>

        <!-- Submission Cards Grid -->
        <div id="exitInterviewList" class="row g-4">
          <div class="col-12 text-center text-muted py-5">
            <div
              class="spinner-border text-primary spinner-border-sm mb-2"
              role="status"
            ></div>
            <div>Loading submissions...</div>
          </div>
        </div>

        <!-- Conditional Pagination Mount -->
        <div
          id="exitInterviewPagination"
          class="table-pagination-container hidden"
        ></div>
      </div>
    </main>

    <!-- MODAL: BUAT EXIT INTERVIEW -->
    <div
      class="modal fade"
      id="exitInterviewModal"
      tabindex="-1"
      aria-labelledby="exitInterviewModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header border-0 pb-2">
            <h5
              class="modal-title font-extrabold text-slate-900"
              id="exitInterviewModalLabel"
            >
              Buat Exit Interview
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <textarea
              id="exitContentInput"
              class="form-control"
              placeholder="Tulis exit interview...."
            ></textarea>
            <div class="exit-char-count">
              <span id="exitCharCount">0</span> karakter
            </div>
          </div>
          <div class="modal-footer border-0">
            <button
              type="button"
              class="btn btn-light rounded-pill px-4 border"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              type="button"
              class="btn btn-primary rounded-pill px-4 bg-[#0b2b6a] hover:bg-[#12377f] border-0"
              id="exitSaveButton"
            >
              Submit
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts: SweetAlert2, Bootstrap 5.3 Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Exit Interview Orchestrator -->
    <script
      type="module"
      src="/pages/hr/exit-interview/exit-interview.js"
    ></script>
  </body>
</html>
