<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/webp" href="../../assets/img/favicon.webp">
    <link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.webp">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Team Dialogika</title>

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Font Awesome (Required for Eye Icon) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Share Tech Mono (card numbers) -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <!-- New architecture foundation: shared theme tokens -->
    <link href="../../assets/css/theme.css" rel="stylesheet">
    <!-- Registration feature styles -->
    <link href="../../pages/register/register.css" rel="stylesheet">
</head>

<body>
    <!-- 1. TOP BAR FIXED -->
    <nav class="top-bar">
        <!-- CENTER: LOGO DIALOGIKA -->
        <div class="logo-center">
            <img src="https://www.dialogika.co/assets/img/logo.webp" alt="Dialogika Logo" height="35">
        </div>
    </nav>

    <!-- WRAPPER CONTENT (Flex Item) -->
    <div class="container main-layout">

        <!-- 1. BAGIAN KARTU -->
        <div style="width: 100%; margin-bottom:-200px">
            <div class="card-wrapper" id="cardWrapper">
                <div class="card-inner">
                    <!-- DEPAN -->
                    <div class="card-face card-front">
                        <div class="card-top">
                            <div class="card-chip"></div>
                            <div class="photo-area">
                                <div class="photo-preview-card" id="cardPhotoPreview"></div>
                                <span class="birth-label">Birth Date</span>
                                <div class="birth-date-display" id="cardBirthFront">MM/YY</div>
                            </div>
                        </div>

                        <div class="card-number-container">
                            <div class="card-number" id="cardIDDisplay">#### #### #### ####</div>
                            <div class="card-password-display" id="cardPassDisplay">****</div>
                        </div>

                        <div class="card-bottom">
                            <div>
                                <div class="detail-label">Card Holder</div>
                                <div class="detail-value-name" id="cardName">FULL NAME</div>
                                <div class="detail-value-pos" id="cardPosDisplay">POSITION</div>
                            </div>
                            <img style="max-height:25px;" src="https://www.dialogika.co/assets/img/white-logo.webp"
                                alt="Dialogika" class="logo-img"
                                onerror="this.src='https://via.placeholder.com/100x40?text=DIALOGIKA'">
                        </div>
                    </div>

                    <!-- BELAKANG -->
                    <div class="card-face card-back">
                        <div class="magnetic-strip"></div>
                        <span class="cvv-label">EMAIL</span>
                        <div class="signature-strip">
                            <div class="email-display-back" id="cardEmailBack">email@example.com</div>
                        </div>
                        <div class="back-details">
                            <div id="cardPhone">Tel: -</div>
                            <div id="cardIG">IG: -</div>
                            <div id="cardLinked">In: -</div>
                        </div>
                        <img src="https://www.dialogika.co/assets/img/white-logo.webp" style="max-height:25px;"
                            alt="Dialogika" class="logo-img visa-logo-back"
                            onerror="this.src='https://via.placeholder.com/100x40?text=DIALOGIKA'">
                    </div>
                </div>
            </div>
            <p class="text-center text-muted small mt-2">Klik kartu untuk melihat sisi belakang</p>
        </div>

        <!-- 2. BAGIAN FORM -->
        <div class="form-box" style="padding-top:150px;">
            <h4 class="mb-4 text-center fw-bold" style="color: #07276B;">Registrasi Team</h4>

            <!-- Message banner (success / error / info) -->
            <div id="registerMessage" class="register-alert"></div>

            <form id="regForm" novalidate>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="inputName" name="name" placeholder="Nama Lengkap"
                            required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Position</label>
                        <select class="form-select" id="inputPos" required>
                            <option value="" disabled selected>Loading...</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="inputEmail" name="email"
                        placeholder="email@address.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <div class="password-wrapper">
                        <input type="password" class="form-control" id="inputPass" name="password" required>
                        <i class="fas fa-eye password-toggle"></i>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Upload Photo</label>
                    <label for="inputPhoto" class="upload-area">
                        <i class="fas fa-cloud-upload-alt upload-icon"></i>
                        <span class="upload-text" id="uploadText">Klik untuk upload foto</span>
                        <span class="upload-hint">Format PNG, JPG (Max. 5MB)</span>
                        <input type="file" id="inputPhoto" accept="image/*" hidden>
                    </label>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Birth Date</label>
                        <input type="date" class="form-control" id="inputBirth" name="birth" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Phone</label>
                        <input type="tel" class="form-control" id="inputPhone" placeholder="08..." required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Instagram (@username)</label>
                        <input type="text" class="form-control" id="inputIG" placeholder="instagram.com/....">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">LinkedIn (Link)</label>
                        <input type="text" class="form-control" id="inputLinked" placeholder="linkedin.com/in/....">
                    </div>
                </div>

                <button type="submit" class="btn blue-dialogika-btn w-100 mt-3" id="btnSubmit"
                    style="border-radius:10px;">Submit Registration</button>
            </form>
        </div>
    </div>

    <!-- 3. FOOTER -->
    <footer>
        <div id="footer">
            <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">

                <div class="me-md-auto text-center text-md-start">
                    <div class="copyright">
                        &copy; Copyright <strong><span>Dialogika</span></strong> | PT. Dialogika Persona Indonesia
                    </div>
                </div>

                <div class="social-links text-center text-md-right">
                    <a href="https://link.dialogika.co/twitter" class="twitter"><i class="bi bi-twitter"></i></a>
                    <a href="https://link.dialogika.co/facebook" class="facebook"><i class="bi bi-facebook"></i></a>
                    <a href="https://link.dialogika.co/instagram" class="instagram"><i class="bi bi-instagram"></i></a>
                    <a href="https://wa.link/emi1qx" class="instagram"><i class="bi bi-whatsapp"></i></a>
                    <a href="https://link.dialogika.co/linkedin" class="instagram"><i class="bi bi-linkedin"></i></a>
                </div>

            </div>
        </div>
    </footer>

    <!-- Registration orchestrator (data + UI separated in repository/ui) -->
    <script type="module" src="../../pages/register/register.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
