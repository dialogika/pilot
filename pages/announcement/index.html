<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/webp" href="/assets/img/favicon.webp" />
    <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.webp" />
    <title>Announcement - Team Dialogika</title>

    <!-- Bootstrap 5.3 + Icons + SweetAlert2 + Poppins (CDN) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Dialogika Foundation Styles -->
    <link href="/assets/css/theme.css" rel="stylesheet" />
    <link href="/assets/css/layout.css" rel="stylesheet" />
    <!-- Quest & Report Modal styles -->
    <link href="/assets/js/components/quest-modal/quest-modal.css" rel="stylesheet" />
    <link href="/assets/js/components/report-modal/report-modal.css" rel="stylesheet" />
    <!-- Feature-specific styles -->
    <link href="/pages/announcement/announcement.css" rel="stylesheet" />

    <!-- Shared theme manager -->
    <script src="/assets/js/theme.js" defer></script>
  </head>

  <body>
    <!-- Shared shell mounts (renderTopbar / renderSidebar) -->
    <div id="dg-topbar-mount"></div>
    <div id="dg-sidebar-mount"></div>

    <main class="dg-main">
      <div class="announcement-wrap">
        <!-- Page Header -->
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
          <div>
            <h4 class="fw-bold mb-0 announcement-header-title">Announcement</h4>
            <small class="announcement-header-desc">Buat dan kelola pengumuman untuk seluruh tim.</small>
          </div>
          <button
            type="button"
            id="btnCreateAnnouncement"
            class="btn btn-dlg-blue rounded-pill px-4"
          >
            <i class="bi bi-plus-lg me-1"></i> Create Announcement
          </button>
        </div>

        <!-- Filter Bar -->
        <div class="d-flex flex-wrap gap-2 mb-4">
          <select
            id="filterTypeSelect"
            class="form-select rounded-pill announcement-filter-select"
            style="width: 160px"
          >
            <option value="all">All Types</option>
            <option value="info">Info</option>
            <option value="update">Update</option>
            <option value="warning">Warning</option>
            <option value="urgent">Urgent</option>
          </select>
          <select
            id="filterStatusSelect"
            class="form-select rounded-pill announcement-filter-select"
            style="width: 160px"
          >
            <option value="all">All Status</option>
            <option value="active" selected>Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>

        <!-- Announcements Card Grid -->
        <div id="announcementList" class="row g-3">
          <div class="col-12 text-center text-muted py-5">
            <div class="spinner-border text-primary mb-3" role="status" style="width: 2rem; height: 2rem;"></div>
            <div>Loading announcements...</div>
          </div>
        </div>
      </div>
    </main>

    <!-- MODAL: CREATE / EDIT ANNOUNCEMENT -->
    <div
      class="modal fade"
      id="announcementModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content rounded-4 border-0 shadow">
          <div class="modal-header border-0 pb-2 px-4 pt-4">
            <h5 class="modal-title fw-bold" id="announcementModalTitle">
              Create Announcement
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body p-4 pt-2">
            <input type="hidden" id="announcementId" />

            <!-- Title Input -->
            <div class="mb-3">
              <label class="form-label fw-semibold" for="announcementTitleInput">Title</label>
              <input
                type="text"
                id="announcementTitleInput"
                class="form-control form-control-lg"
                placeholder="e.g. Jadwal Libur Nasional"
              />
            </div>

            <!-- Type Pills Selection -->
            <div class="mb-3">
              <label class="form-label fw-semibold d-block">Type</label>
              <div class="d-flex flex-wrap gap-2">
                <span class="type-pill pill-info active-pill" data-type="info">Info</span>
                <span class="type-pill pill-update" data-type="update">Update</span>
                <span class="type-pill pill-warning" data-type="warning">Warning</span>
                <span class="type-pill pill-urgent" data-type="urgent">Urgent</span>
              </div>
              <input type="hidden" id="announcementTypeInput" value="info" />
            </div>

            <!-- Target Department Selection -->
            <div class="mb-3">
              <label class="form-label fw-semibold" for="announcementTargetSelect">Target Audience</label>
              <select id="announcementTargetSelect" class="form-select">
                <option value="">All Employees</option>
              </select>
            </div>

            <!-- Content Rich-Text Editor -->
            <div class="mb-3">
              <label class="form-label fw-semibold" for="announcementContentInput">Content</label>
              <div class="modal-editor-box">
                <div class="modal-editor-toolbar">
                  <button
                    type="button"
                    class="btn btn-sm btn-editor-tool"
                    data-editor-cmd="bold"
                    title="Bold"
                  >
                    <b>B</b>
                  </button>
                  <button
                    type="button"
                    class="btn btn-sm btn-editor-tool"
                    data-editor-cmd="italic"
                    title="Italic"
                  >
                    <i>I</i>
                  </button>
                  <button
                    type="button"
                    class="btn btn-sm btn-editor-tool"
                    data-editor-cmd="insertUnorderedList"
                    title="List"
                  >
                    <i class="bi bi-list-ul"></i>
                  </button>
                </div>
                <div
                  id="announcementContentInput"
                  class="modal-editor-content"
                  contenteditable="true"
                  data-placeholder="Tulis isi pengumuman di sini..."
                ></div>
              </div>
            </div>

            <!-- Switch Toggles (Pinned & Active) -->
            <div class="d-flex flex-wrap gap-4 pt-1">
              <div class="form-check form-switch">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="announcementPinnedInput"
                />
                <label class="form-check-label" for="announcementPinnedInput">Pin di atas</label>
              </div>
              <div class="form-check form-switch">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="announcementActiveInput"
                  checked
                />
                <label class="form-check-label" for="announcementActiveInput">Active (tampil di Home)</label>
              </div>
            </div>
          </div>
          <div class="modal-footer border-0 p-4 pt-0">
            <button
              type="button"
              class="btn btn-modal-cancel rounded-pill px-4 border"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              type="button"
              class="btn btn-dlg-blue rounded-pill px-4"
              id="announcementSaveButton"
            >
              Save
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- MODAL: DELETE CONFIRMATION -->
    <div
      class="modal fade"
      id="deleteAnnouncementModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 border-0 shadow">
          <div class="modal-header border-0 p-4 pb-0">
            <h5 class="fw-bold text-danger">
              <i class="bi bi-exclamation-triangle me-2"></i>Delete Announcement
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body p-4">
            <p class="mb-0 delete-modal-text">
              Yakin ingin menghapus pengumuman
              <span id="deleteAnnouncementTitle" class="fw-bold delete-modal-target"></span>?
            </p>
            <input type="hidden" id="deleteAnnouncementId" />
          </div>
          <div class="modal-footer border-0 px-4 pb-4">
            <button
              type="button"
              class="btn btn-modal-cancel rounded-pill px-4 border"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              type="button"
              class="btn btn-danger rounded-pill px-4"
              id="btnConfirmDeleteAnnouncement"
            >
              Delete
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- CDN Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Announcement Orchestrator Module -->
    <script type="module" src="/pages/announcement/announcement.js"></script>
  </body>
</html>
