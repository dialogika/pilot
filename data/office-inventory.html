    <script type="module">
        import { renderTopBar } from "../element/topbar.js";
        import { renderSidebar } from "../element/sidebar.js";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { app, auth, db } from "../assets/js/firebase-config.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import {
            getFirestore, collection, addDoc, query, where, getDoc, getDocs,
            serverTimestamp, onSnapshot, orderBy, doc, deleteDoc, updateDoc, setDoc
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        

        window.db = db;
        window.collection = collection;
        window.getDoc = getDoc;
        window.getDocs = getDocs;
        window.addDoc = addDoc;
        window.serverTimestamp = serverTimestamp;
        window.doc = doc;
        window.updateDoc = updateDoc;
        window.deleteDoc = deleteDoc;
        window.setDoc = setDoc;

        const topbarTarget = document.getElementById('topbarContainer');
        renderTopBar(topbarTarget);
        const sidebarTarget = document.getElementById('sidebarContainer');
        renderSidebar(sidebarTarget);

        window.toggleSidebar = () => {
            const sidebar = document.getElementById('sidebarNav');
            if (!sidebar) return;
            const isMobile = window.innerWidth <= 991;
            if (isMobile) {
                sidebar.classList.toggle('show');
            } else {
                document.body.classList.toggle('sidebar-collapsed');
            }
        };

        // --- DATA MASTER ---
        const KATEGORI_MAP = {
            ATK: 'Alat Tulis', ETK: 'Elektronik', FUR: 'Furnitur',
            BRS: 'Kebersihan', SMP: 'Penyimpanan', PERTEN: 'Peralatan Konten',
            DEC: 'Dekorasi', OTH: 'Lainnya'
        };
        const LOKASI_MAP = {
            UTM: 'Ruang Utama', KLS: 'Ruang Kelas', INT: 'Dengan Intern',
            STD: 'Ruang Studio', JNT: 'Janitor', HLM: 'Halaman Belakang', MUS: 'Musholla'
        };
        const STATUS_MAP = {
            Available: { label: 'Available', class: 'status-available' },
            'In Use': { label: 'In Use', class: 'status-in-use' },
            Repair: { label: 'Repair', class: 'status-repair' }
        };

        let allItems = [];
        let deletingId = null;
        let editingId = null;
        let kategoriCounterCache = {};

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "../index.html";
                return;
            }
            loadKategoriCounters();
            listenToInventory();
            setupControls();
        });

        // --- GENERATE ID ---
        async function generateInventoryID(kategoriKode, lokasiKode, tglBeli, tipe) {
            const key = kategoriKode + '.' + lokasiKode;
            let lastUrut = kategoriCounterCache[key] || 0;

            const q = query(
                collection(db, 'inventory'),
                where('kategori_kode', '==', kategoriKode),
                where('lokasi_kode', '==', lokasiKode),
                orderBy('urutan', 'desc')
            );
            try {
                const snap = await getDocs(q);
                if (!snap.empty) {
                    const maxUrut = snap.docs[0].data().urutan || 0;
                    if (maxUrut > lastUrut) lastUrut = maxUrut;
                }
            } catch (e) {
                console.warn('Gagal query counter, pakai cache', e);
            }

            const urutBaru = lastUrut + 1;
            kategoriCounterCache[key] = urutBaru;

            const d = new Date(tglBeli);
            const bulan = String(d.getMonth() + 1).padStart(2, '0');
            const tanggal = String(d.getDate()).padStart(2, '0');

            const urutStr = String(urutBaru).padStart(3, '0');
            return `${kategoriKode}.${lokasiKode}.${urutStr}/DIA/${bulan}.${tanggal}/${tipe}`;
        }

        async function loadKategoriCounters() {
            try {
                const snap = await getDocs(collection(db, 'inventory'));
                snap.forEach(docSnap => {
                    const d = docSnap.data();
                    if (d.kategori_kode && d.lokasi_kode) {
                        const key = d.kategori_kode + '.' + d.lokasi_kode;
                        const urut = d.urutan || 0;
                        if (!kategoriCounterCache[key] || urut > kategoriCounterCache[key]) {
                            kategoriCounterCache[key] = urut;
                        }
                    }
                });
            } catch (e) {
                console.warn('Gagal load counter cache', e);
            }
        }

        // --- LISTENER REAL-TIME ---
        function listenToInventory() {
            const q = query(collection(db, 'inventory'), orderBy('created_at', 'desc'));
            onSnapshot(q, (snapshot) => {
                allItems = [];
                snapshot.forEach(docSnap => {
                    allItems.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderTable();
            }, (error) => {
                console.error('Gagal listen inventory:', error);
            });
        }

        // --- RENDER TABLE ---
        function renderTable() {
            const tbody = document.getElementById('inventoryTableBody');

            if (!allItems.length) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="10" class="px-6 py-12 text-center text-slate-400">
                            <i class="fas fa-box-open text-3xl mb-3 block"></i>
                            Belum ada data inventaris.
                        </td>
                    </tr>
                `;
                return;
            }

            const searchVal = (document.getElementById('searchInput').value || '').toLowerCase();
            let filtered = allItems;
            if (searchVal) {
                filtered = allItems.filter(item =>
                    (item.nama_barang || '').toLowerCase().includes(searchVal) ||
                    (item.id_generated || '').toLowerCase().includes(searchVal) ||
                    (item.kategori_kode || '').toLowerCase().includes(searchVal)
                );
            }

            tbody.innerHTML = filtered.map(item => {
                const kategoriLabel = KATEGORI_MAP[item.kategori_kode] || item.kategori_kode || '-';
                const lokasiLabel = LOKASI_MAP[item.lokasi_kode] || item.lokasi_kode || '-';
                const statusInfo = STATUS_MAP[item.status] || { label: item.status || 'Available', class: 'status-available' };

                let tglBeli = '-';
                if (item.tanggal_beli) {
                    try {
                        const d = item.tanggal_beli.toDate ? item.tanggal_beli.toDate() : new Date(item.tanggal_beli);
                        tglBeli = d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
                    } catch (e) { tglBeli = String(item.tanggal_beli); }
                }

                const idDisplay = item.id_generated || item.id || '-';
                const kondisi = item.kondisi || 'Baik';
                const jumlah = item.jumlah || 1;
                
                let kondisiColor = 'text-green-600 bg-green-50';
                if (kondisi === 'Rusak Ringan') kondisiColor = 'text-yellow-600 bg-yellow-50';
                if (kondisi === 'Rusak Berat') kondisiColor = 'text-red-600 bg-red-50';

                return `
                    <tr class="hover:bg-slate-50 transition text-xs">
                        <td class="px-4 py-2">
                            <span class="id-monospace">${idDisplay}</span>
                        </td>
                        <td class="px-4 py-2 font-semibold text-slate-800">${item.nama_barang || '-'}</td>
                        <td class="px-4 py-2 text-slate-600">
                            <span class="bg-slate-100 text-slate-700 px-2 py-0.5 rounded-md text-xs font-semibold">${item.kategori_kode}</span>
                            <span class="text-xs text-slate-400 ml-1">${kategoriLabel}</span>
                        </td>
                        <td class="px-4 py-2 text-slate-600">
                            <span class="bg-slate-100 text-slate-700 px-2 py-0.5 rounded-md text-xs font-semibold">${item.lokasi_kode}</span>
                            <span class="text-xs text-slate-400 ml-1">${lokasiLabel}</span>
                        </td>
                        <td class="px-4 py-2 text-xs text-slate-600">${tglBeli}</td>
                        <td class="px-4 py-2">
                            <span class="text-xs font-bold ${item.tipe_pembelian === 'SUB' ? 'text-amber-600' : 'text-slate-500'}">
                                ${item.tipe_pembelian || 'OTM'}
                            </span>
                        </td>
                        <td class="px-4 py-2">
                            <span class="px-1.5 py-0.5 rounded-md text-xs font-medium ${kondisiColor}">${kondisi}</span>
                        </td>
                        <td class="px-4 py-2 text-center font-medium text-slate-700">${jumlah}</td>
                        <td class="px-4 py-2">
                            <span class="status-badge ${statusInfo.class}">
                                <i class="fas fa-circle text-[5px]"></i>
                                ${statusInfo.label}
                            </span>
                        </td>
                        <td class="px-4 py-2 text-right">
                            <div class="flex justify-end gap-2 text-slate-400">
                                <button class="hover:text-blue-500 edit-btn" data-id="${item.id}" data-nama="${item.nama_barang || ''}">
                                    <i class="fas fa-pen"></i>
                                </button>
                                <button class="hover:text-red-500 delete-btn" data-id="${item.id}" data-nama="${item.nama_barang || ''}">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    deletingId = btn.dataset.id;
                    document.getElementById('deleteItemName').textContent = btn.dataset.nama;
                    document.getElementById('deleteOverlay').classList.add('show');
                });
            });
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    openEdit(btn.dataset.id);
                });
            });
        }

        // --- SAVE ---
        async function saveInventory() {
            const nama = document.getElementById('addNama').value.trim();
            const kategori = document.getElementById('addKategori').value;
            const lokasi = document.getElementById('addLokasi').value;
            const tglBeli = document.getElementById('addTglBeli').value;
            const tipe = document.getElementById('addTipe').value;
            const kondisi = document.getElementById('addKondisi').value;
            const jumlah = parseInt(document.getElementById('addJumlah').value) || 1;

            if (!nama) { alert('Nama barang harus diisi.'); return; }
            if (!kategori) { alert('Kategori harus dipilih.'); return; }
            if (!lokasi) { alert('Lokasi harus dipilih.'); return; }
            if (!tglBeli) { alert('Tanggal beli harus diisi.'); return; }

            const saveBtn = document.getElementById('addSave');
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';

            try {
                const idGenerated = await generateInventoryID(kategori, lokasi, tglBeli, tipe);

                await addDoc(collection(db, 'inventory'), {
                    id_generated: idGenerated,
                    nama_barang: nama,
                    kategori_kode: kategori,
                    kategori_label: KATEGORI_MAP[kategori] || kategori,
                    lokasi_kode: lokasi,
                    lokasi_label: LOKASI_MAP[lokasi] || lokasi,
                    tanggal_beli: new Date(tglBeli),
                    tipe_pembelian: tipe,
                    kondisi: kondisi,
                    jumlah: jumlah,
                    status: 'Available',
                    urutan: kategoriCounterCache[kategori + '.' + lokasi] || 1,
                    created_at: serverTimestamp()
                });

                closeAdd();
                alert('Barang berhasil ditambahkan!');
            } catch (e) {
                console.error('Gagal menyimpan:', e);
                alert('Gagal menyimpan: ' + e.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i class="fas fa-save mr-1"></i> Simpan';
            }
        }

        // --- DELETE ---
        async function confirmDelete() {
            if (!deletingId) return;
            try {
                await deleteDoc(doc(db, 'inventory', deletingId));
                deletingId = null;
                document.getElementById('deleteOverlay').classList.remove('show');
            } catch (e) {
                console.error('Gagal menghapus:', e);
                alert('Gagal menghapus: ' + e.message);
            }
        }

        async function editInventory() {
            if (!editingId) return;
            const nama = document.getElementById('editNama').value.trim();
            const kategori = document.getElementById('editKategori').value;
            const lokasi = document.getElementById('editLokasi').value;
            const tglBeli = document.getElementById('editTglBeli').value;
            const tipe = document.getElementById('editTipe').value;
            const kondisi = document.getElementById('editKondisi').value;
            const status = document.getElementById('editStatus').value;
            const jumlah = parseInt(document.getElementById('editJumlah').value) || 1;

            if (!nama) { alert('Nama barang harus diisi.'); return; }
            if (!kategori) { alert('Kategori harus dipilih.'); return; }
            if (!lokasi) { alert('Lokasi harus dipilih.'); return; }
            if (!tglBeli) { alert('Tanggal beli harus diisi.'); return; }

            const saveBtn = document.getElementById('editSave');
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';

            try {
                await updateDoc(doc(db, 'inventory', editingId), {
                    nama_barang: nama,
                    kategori_kode: kategori,
                    kategori_label: KATEGORI_MAP[kategori] || kategori,
                    lokasi_kode: lokasi,
                    lokasi_label: LOKASI_MAP[lokasi] || lokasi,
                    tanggal_beli: new Date(tglBeli),
                    tipe_pembelian: tipe,
                    kondisi: kondisi,
                    status: status,
                    jumlah: jumlah
                });

                closeEdit();
                alert('Inventaris berhasil diperbarui!');
            } catch (e) {
                console.error('Gagal menyimpan:', e);
                alert('Gagal menyimpan: ' + e.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i class="fas fa-save mr-1"></i> Simpan';
            }
        }
        function closeAdd() {
            document.getElementById('addOverlay').classList.remove('show');
            document.getElementById('addNama').value = '';
            document.getElementById('addKategori').value = '';
            document.getElementById('addLokasi').value = '';
            document.getElementById('addTglBeli').value = '';
            document.getElementById('addTipe').value = 'OTM';
            document.getElementById('addKondisi').value = 'Baik';
            document.getElementById('addJumlah').value = '1';
        }
        function closeEdit() {
            document.getElementById('editOverlay').classList.remove('show');
            editingId = null;
        }

        function openEdit(id) {
            const item = allItems.find(i => i.id === id);
            if (!item) return;

            editingId = id;

            document.getElementById('editNama').value = item.nama_barang || '';
            document.getElementById('editKategori').value = item.kategori_kode || '';
            document.getElementById('editLokasi').value = item.lokasi_kode || '';
            document.getElementById('editTipe').value = item.tipe_pembelian || 'OTM';
            document.getElementById('editKondisi').value = item.kondisi || 'Baik';
            document.getElementById('editStatus').value = item.status || 'Available';
            document.getElementById('editJumlah').value = item.jumlah || 1;

            if (item.tanggal_beli) {
                try {
                    const d = item.tanggal_beli.toDate ? item.tanggal_beli.toDate() : new Date(item.tanggal_beli);
                    const iso = d.toISOString().split('T')[0];
                    document.getElementById('editTglBeli').value = iso;
                } catch (e) { }
            }

            document.getElementById('editOverlay').classList.add('show');
        }

        function setupControls() {
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', renderTable);
            }

            document.getElementById('addInventoryBtn').addEventListener('click', () => {
                document.getElementById('addOverlay').classList.add('show');
            });
            document.getElementById('addClose').addEventListener('click', closeAdd);
            document.getElementById('addCancel').addEventListener('click', closeAdd);
            document.getElementById('addSave').addEventListener('click', saveInventory);

            document.getElementById('deleteCancel').addEventListener('click', () => {
                deletingId = null;
                document.getElementById('deleteOverlay').classList.remove('show');
            });
            document.getElementById('deleteConfirm').addEventListener('click', confirmDelete);
            document.getElementById('editCancel').addEventListener('click', closeEdit);
            document.getElementById('editSave').addEventListener('click', editInventory);
        }
    </script>

</body>
</html>
