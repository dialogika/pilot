<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/webp" href="/assets/img/favicon.webp" />
    <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.webp" />
    <title>Scouting Candidate — Dialogika</title>

    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <!-- Bootstrap 5.3 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Tailwind CSS (CDN for utility compatibility) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- ExcelJS for Spreadsheet Export with Photos -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>

    <!-- Lucide Icons for Recruitment Shortcut -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Shared Foundation Styles -->
    <link rel="stylesheet" href="/assets/css/theme.css" />
    <link rel="stylesheet" href="/assets/css/layout.css" />

    <!-- Scoped Feature Styles -->
    <link rel="stylesheet" href="/pages/hr/scouting-candidate/scouting.css" />

    <!-- Shared theme manager -->
    <script src="/assets/js/theme.js" defer></script>
    <style>
      body {
        font-family: "Poppins", sans-serif;
      }
    </style>
  </head>

  <body class="antialiased bg-slate-50 text-slate-800">
    <!-- Shell Mount Points -->
    <div id="dg-topbar-mount"></div>
    <div id="dg-sidebar-mount"></div>

    <!-- Main Content Area -->
    <main class="dg-main">
      <div class="w-full">
        <!-- Page Header -->
        <div
          class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3"
        >
          <div>
            <!-- Breadcrumb -->
            <nav
              class="flex items-center gap-2 text-[11px] font-bold uppercase tracking-wider mb-1.5"
            >
              <a
                href="/home"
                class="text-blue-600 hover:text-blue-700 transition"
                title="Home"
              >
                <i class="fas fa-home text-xs"></i>
              </a>
              <span class="text-blue-600">/</span>
              <span class="text-blue-600">HR DIVISION</span>
              <span class="text-slate-400">/</span>
              <span class="text-slate-400">SCOUTING CANDIDATE</span>
            </nav>
            <h1 class="page-title mb-1">Scouting Candidate</h1>
            <p class="text-slate-500 text-xs mb-0">
              Kumpulkan dan pantau calon talenta terbaik untuk tim Anda.
            </p>
          </div>

          <div class="d-flex align-items-center gap-2 flex-wrap">
            <!-- View Toggle Group -->
            <div class="d-flex gap-1 me-1" role="group" aria-label="View toggle">
              <button
                type="button"
                id="viewGridBtn"
                class="view-toggle-btn active"
                title="Grid View"
              >
                <i class="fas fa-th-large"></i>
              </button>
              <button
                type="button"
                id="viewListBtn"
                class="view-toggle-btn"
                title="List View"
              >
                <i class="fas fa-list"></i>
              </button>
            </div>

            <!-- Export Excel Button -->
            <button
              type="button"
              id="btnExportExcel"
              class="btn btn-success d-inline-flex align-items-center gap-2 rounded-xl text-xs font-semibold px-3 py-2"
            >
              <i class="fas fa-file-excel"></i> Export Excel
            </button>

            <!-- Add Candidate Button -->
            <button
              type="button"
              id="btnAddCandidate"
              class="btn btn-primary d-inline-flex align-items-center gap-2 rounded-xl text-xs font-semibold px-4 py-2"
              style="background-color: #0b2b6a; border-color: #0b2b6a;"
            >
              <i class="fas fa-plus"></i> Tambah Data
            </button>
          </div>
        </div>

        <!-- Filter & Search Bar -->
        <div class="filter-panel mb-4">
          <div class="row g-3 align-items-center">
            <div class="col-12 col-md-6">
              <div class="relative">
                <i
                  class="fas fa-search absolute left-3.5 top-3 text-slate-400 text-xs"
                ></i>
                <input
                  type="text"
                  id="candidateSearchInput"
                  class="form-control rounded-xl pl-9 text-xs py-2 border-slate-200"
                  placeholder="Cari kandidat..."
                />
              </div>
            </div>
            <div class="col-6 col-md-3">
              <select
                id="candidateStatusFilter"
                class="form-select rounded-xl text-xs py-2 border-slate-200"
              >
                <option value="all">Semua status</option>
                <option value="radar">Radar</option>
                <option value="contacted">Contacted</option>
                <option value="respond">Respond</option>
                <option value="interview">Interview</option>
                <option value="ojt">On Job Test</option>
                <option value="decision">Decision</option>
                <option value="rejected">Rejected</option>
                <option value="accepted">Accepted</option>
              </select>
            </div>
            <div class="col-6 col-md-3">
              <select
                id="candidateSortSelect"
                class="form-select rounded-xl text-xs py-2 border-slate-200"
              >
                <option value="newest">Terkini</option>
                <option value="oldest">Terlama</option>
                <option value="name-asc">Nama (A-Z)</option>
                <option value="name-desc">Nama (Z-A)</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Grid View Container -->
        <div class="row g-4" id="gridView"></div>

        <!-- List View Table Container -->
        <div
          class="card rounded-2xl shadow-sm border border-slate-100 overflow-hidden d-none mb-5"
          id="listView"
        >
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0 text-sm">
              <thead class="bg-slate-50 text-slate-600 text-xs font-semibold">
                <tr>
                  <th class="ps-4 py-3">Kandidat</th>
                  <th class="py-3">Platform</th>
                  <th class="py-3">Status</th>
                  <th class="py-3">Jadwal Interview</th>
                  <th class="py-3">Assigned To</th>
                  <th class="text-center py-3">Aksi</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100"></tbody>
            </table>
          </div>
        </div>

        <!-- Pagination Container -->
        <div id="scoutingPagination" class="candidate-pagination-wrap mt-4 mb-5"></div>
      </div>
    </main>

    <!-- Modal Add / Edit Candidate -->
    <div
      class="modal fade"
      id="candidateAddModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Tambah Kandidat</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <form id="candidateAddForm">
            <div class="modal-body">
              <div class="row g-3">
                <div class="col-md-6">
                  <label
                    for="candidateNameInput"
                    class="form-label small fw-bold text-slate-700"
                    >Nama Lengkap</label
                  >
                  <input
                    type="text"
                    id="candidateNameInput"
                    class="form-control rounded-xl text-xs py-2"
                    placeholder="Nama calon kandidat"
                    required
                  />
                </div>
                <div class="col-md-6">
                  <label
                    for="candidateRoleInput"
                    class="form-label small fw-bold text-slate-700"
                    >Role</label
                  >
                  <select
                    id="candidateRoleInput"
                    class="form-select rounded-xl text-xs py-2"
                  >
                    <option value="">Pilih role</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label
                    for="candidatePositionSelect"
                    class="form-label small fw-bold text-slate-700"
                    >Posisi</label
                  >
                  <select
                    id="candidatePositionSelect"
                    class="form-select rounded-xl text-xs py-2"
                  >
                    <option value="">Pilih posisi</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label
                    for="candidateChannelTypeSelect"
                    class="form-label small fw-bold text-slate-700"
                    >Platform Media Sosial</label
                  >
                  <select
                    id="candidateChannelTypeSelect"
                    class="form-select rounded-xl text-xs py-2"
                  >
                    <option value="instagram">Instagram</option>
                    <option value="linkedin">LinkedIn</option>
                    <option value="tiktok">TikTok</option>
                    <option value="facebook">Facebook</option>
                  </select>
                </div>
                <div class="col-md-12">
                  <label
                    for="candidateChannelUrlInput"
                    class="form-label small fw-bold text-slate-700"
                    >Link Profile / Postingan</label
                  >
                  <input
                    type="url"
                    id="candidateChannelUrlInput"
                    class="form-control rounded-xl text-xs py-2"
                    placeholder="https://instagram.com/p/..."
                  />
                </div>

                <!-- Multi-Assign to Users -->
                <div class="col-md-12">
                  <label class="form-label small fw-bold text-slate-700"
                    >Assign To (Personil)</label
                  >
                  <div class="assign-dropdown" id="assignDropdown">
                    <div class="assign-display" id="assignDisplay">
                      Pilih assign...
                    </div>
                    <input type="hidden" id="candidateAssignInput" value="" />
                    <div class="assign-menu">
                      <div class="p-1 mb-2">
                        <input
                          type="text"
                          id="assignUserSearch"
                          class="form-control form-control-sm rounded-lg text-xs"
                          placeholder="Cari user..."
                        />
                      </div>
                      <div id="candidateAssignUsers" class="d-grid gap-1"></div>
                    </div>
                  </div>
                </div>

                <!-- Photo Upload Box -->
                <div class="col-md-12">
                  <label class="form-label small fw-bold text-slate-700"
                    >Foto Profil Kandidat</label
                  >
                  <input
                    type="file"
                    id="candidateImageUrlInput"
                    class="d-none"
                    accept="image/*"
                  />
                  <div class="photo-upload-box" id="candidatePhotoUpload">
                    <div class="upload-prompt text-center">
                      <i class="fas fa-cloud-upload-alt text-2xl text-slate-400 mb-1"></i>
                      <div class="small fw-semibold text-slate-600">
                        Klik untuk upload foto
                      </div>
                      <small class="text-slate-400"
                        >Maksimal 5MB (JPG, PNG, WebP)</small
                      >
                    </div>
                  </div>
                  <div class="d-flex align-items-center gap-2 mt-2">
                    <i
                      id="photoStatusIcon"
                      class="fas fa-spinner text-blue-500 text-xs"
                      style="visibility: hidden"
                    ></i>
                    <small
                      id="photoStatusText"
                      class="text-slate-500 text-xs"
                    ></small>
                  </div>
                </div>
              </div>
            </div>
            <div class="modal-footer border-t border-slate-100 px-4 py-3">
              <button
                type="button"
                class="btn btn-light rounded-xl text-xs font-semibold px-4 py-2 border"
                data-bs-dismiss="modal"
              >
                Batal
              </button>
              <button
                type="submit"
                class="btn btn-primary rounded-xl text-xs font-semibold px-4 py-2"
                style="background-color: #0b2b6a; border-color: #0b2b6a;"
              >
                Simpan
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Bootstrap 5.3 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Orchestrator Script Entry Point -->
    <script
      type="module"
      src="/pages/hr/scouting-candidate/scouting.js?v=1.1"
    ></script>
  </body>
</html>
