<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/webp" href="/assets/img/favicon.webp" />
    <title>Dialogika</title>

    <script>
      // Single-Page / Clean URL Routing for GitHub Pages
      (function() {
        var routeMap = {
          "/login": "/login.html",
          "/home": "/home.html",
          "/quest": "/pages/quest/index.html",
          "/internships": "/pages/internships/index.html",
          "/internship-management": "/pages/internships/index.html",
          "/announcement": "/pages/announcement/index.html",
          "/recruitment-dashboard": "/pages/hr/recruitment-dashboard/index.html",
          "/dashboard-recruitment": "/pages/hr/recruitment-dashboard/index.html",
          "/operational-expenses": "/pages/hr/operational-expenses/index.html",
          "/hr/operational-expenses": "/pages/hr/operational-expenses/index.html",
          "/presence-team": "/pages/hr/presence-team/index.html",
          "/hr/presence-team": "/pages/hr/presence-team/index.html",
          "/exit-interview": "/pages/hr/exit-interview/index.html",
          "/hr/exit-interview": "/pages/hr/exit-interview/index.html",
          "/permit-reimburse": "/pages/hr/permit-reimburse/index.html",
          "/hr/permit-reimburse": "/pages/hr/permit-reimburse/index.html",
          "/scouting-candidate": "/pages/hr/scouting-candidate/index.html",
          "/team-management": "/pages/hr/team-management/index.html",
          "/candidate-management": "/pages/hr/candidate-management/index.html",
          "/users-management": "/pages/hr/users-management/index.html",
          "/performance-appraisal": "/pages/hr/performance-appraisal/index.html",
          "/performance-appraisal/form": "/pages/hr/performance-appraisal/form.html",
          "/office-inventory": "/pages/hr/office-inventory/index.html",
          "/people-development": "/pages/hr/people-development/index.html",
          "/company-position": "/pages/hr/company-position/index.html",
          "/member-data": "/pages/marketing/member-data/index.html",
          "/marketing/member-data": "/pages/marketing/member-data/index.html",
          "/webinar": "/pages/marketing/webinar/index.html",
          "/marketing/webinar": "/pages/marketing/webinar/index.html",
          "/mailing-list": "/pages/marketing/mailing-list/index.html",
          "/marketing/mailing-list": "/pages/marketing/mailing-list/index.html",
          "/promo-classes": "/pages/marketing/promo-classes/index.html",
          "/marketing/promo-classes": "/pages/marketing/promo-classes/index.html",
          "/leads-management": "/pages/marketing/leads-management/index.html",
          "/marketing/leads-management": "/pages/marketing/leads-management/index.html",
          "/referral-dashboard": "/pages/marketing/referral-dashboard/index.html",
          "/marketing/referral-dashboard": "/pages/marketing/referral-dashboard/index.html",
          "/class-availability": "/pages/marketing/class-availability/index.html",
          "/marketing/class-availability": "/pages/marketing/class-availability/index.html",
          "/create-invoice": "/pages/marketing/create-invoice/index.html",
          "/marketing/create-invoice": "/pages/marketing/create-invoice/index.html",
          "/generate-certificate": "/pages/product/generate-certificate/index.html",
          "/product/generate-certificate": "/pages/product/generate-certificate/index.html",
          "/mentor-management": "/pages/product/mentor-management/index.html",
          "/class-management": "/pages/product/class-management/index.html",
          "/product-management": "/pages/product/product-management/index.html",
          "/piket-branding": "/pages/branding/piket-branding/index.html",
          "/branding-schedule": "/pages/branding/content-schedule/index.html",
          "/content-schedule": "/pages/branding/content-schedule/index.html",
          "/intern-presence": "/data/intern-presence.html",
          "/intern-satisfaction": "/pages/hr/intern-satisfaction/index.html",
          "/internship-candidate-detail": "/data/internship-candidate-detail.html",
          "/mentor-candidate-detail": "/data/mentor-candidate-detail.html",
          "/team-candidate-detail": "/data/team-candidate-detail.html"
        };

        var path = window.location.pathname.replace(/\/$/, "");
        var target = routeMap[path];

        if (target) {
          try {
            sessionStorage.setItem("dlg_clean_path", path);
          } catch (e) {}
          window.location.replace(target + window.location.search + window.location.hash);
        }
      })();
    </script>

    <!-- Google Fonts: Poppins -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <style>
      :root {
        --dlg-blue: #002b66;
        --dlg-accent: #0056b3;
        --dlg-yellow: #f59e0b;
        --bg-light: #f8fafc;
        --text-dark: #1e293b;
        --text-muted: #64748b;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Poppins", sans-serif;
        background-color: var(--bg-light);
        color: var(--text-dark);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 24px;
        text-align: center;
      }

      .logo-container {
        margin-bottom: 24px;
      }

      .logo-container img {
        height: 42px;
      }

      .card-404 {
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
        max-width: 480px;
        width: 100%;
        padding: 40px 32px;
      }

      .error-code {
        font-size: 72px;
        font-weight: 800;
        line-height: 1;
        color: var(--dlg-blue);
        margin-bottom: 12px;
      }

      .error-title {
        font-size: 20px;
        font-weight: 600;
        color: var(--text-dark);
        margin-bottom: 12px;
      }

      .error-desc {
        font-size: 14px;
        color: var(--text-muted);
        line-height: 1.6;
        margin-bottom: 28px;
      }

      .btn-home {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background-color: var(--dlg-blue);
        color: #ffffff;
        text-decoration: none;
        font-weight: 500;
        font-size: 14px;
        padding: 12px 24px;
        border-radius: 12px;
        transition: all 0.2s ease;
      }

      .btn-home:hover {
        background-color: var(--dlg-accent);
        transform: translateY(-2px);
        color: #ffffff;
      }

      .footer-note {
        margin-top: 24px;
        font-size: 12px;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <div class="logo-container">
      <img src="https://www.dialogika.co/assets/img/logo.webp" alt="Dialogika Logo" />
    </div>

    <div class="card-404">
      <div class="error-code">404</div>
      <h1 class="error-title">Halaman Tidak Ditemukan</h1>
      <p class="error-desc">
        Halaman yang Anda tuju mungkin telah dipindahkan, dihapus, atau tautan yang Anda masukkan salah.
      </p>

      <a href="/login" class="btn-home" id="btnAction">
        <i class="bi bi-arrow-left"></i>
        <span>Kembali ke Halaman Login</span>
      </a>
    </div>

    <div class="footer-note">
      &copy; Dialogika Persona Indonesia
    </div>

    <script>
      try {
        if (localStorage.getItem("userData")) {
          var btn = document.getElementById("btnAction");
          btn.href = "/home";
          btn.querySelector("span").textContent = "Kembali ke Dashboard";
        }
      } catch (e) {}
    </script>
  </body>
</html>
